# kids_soccer_physical_reid08.yaml
# Comments / rationale live in docs/config_notes.md (#kids_soccer_physical_reid08.yaml).

video:
  process_fps: 30
sample:
  stride: 1
intrinsics:
  fx: 2448.68
pitch_type: kids_soccer
field_registration:
  backend: "physical"
  physical:
    camera_profile: "kids_soccer_1080p"
    ransac_reproj_error: 30.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 15.0
    use_line_model: true
    focal_hfov_deg_bounds: [27.0, 45.3]
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 5.0
    camera_position: [-5.557, -21.926, 2.820]
    lock_camera_position: false
    position_weight: 10.0
    calibration_skip: 1
    vis_interval: 1
    gap_fill_chain:
      enabled: true
      anchor_max_reproj_px: 30.0
      overwrite_above_reproj_px: 30.0
      method: improved
      smoothing_window: 5
      use_masking: false
      max_gap_frames: 60
      max_anchor_distance_frames: 120
      sift_top_skip_frac: 0.25
  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260605_073045/models/best_model_final.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
    use_lines: true
    line_model_path: "data/finetuned_line_models/run_20260605_073744/models/best_model_final.pt"
    line_weights: "SV_lines"
    line_threshold: 0.10
device: "cuda"
reid:
  backend: "prtreid"
track_consolidation:
  min_track_seconds: 1.0
  jersey:
    ocr_backend: llm
  frame_stride: 10
pipeline:
  stages:
  - field_registration
  - tracking
  - track_consolidation
  - event_detection
  - player_profile
  - highlights
tracking:
  max_cosine_distance: 0.2
