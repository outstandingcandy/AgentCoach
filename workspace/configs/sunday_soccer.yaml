# sunday_soccer.yaml
# Comments / rationale live in docs/config_notes.md (#sunday_soccer.yaml).

video:
  process_fps: 30
sample:
  stride: 1
pitch_type: fifa
field_registration:
  backend: "physical"
  process_fps: 10
  physical:
    camera_profile: "generic_4k"
    detection_batch_size: 16
    ransac_reproj_error: 50.0
    line_weight: 0.0
    line_sample_points: 20
    max_reproj_error: 25.0
    use_line_model: false
    focal_hfov_deg_bounds: [18.18, 51.28]
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 8.0
    camera_position: [0.6, -41.0, 6.1]
    lock_camera_position: false
    position_weight: 1.0
    position_bounds_m: [12.0, 10.0, 3.0]
    pitch_bounds_deg: [2.0, 15.0]
    calibration_skip: 1
    vis_interval: 30
    gap_fill_chain:
      enabled: true
      frame_step: 3
      matcher_backend: lightglue
      anchor_max_reproj_frac: 0.0104
      overwrite_above_reproj_frac: 0.0104
      method: improved
      smoothing_window: 5
      use_masking: false
      max_gap_frames: 60
      max_anchor_distance_frames: 60
      sift_top_skip_frac: 0.25
  pnlcalib:
    keypoint_model_path: "workspace/models/keypoint_20260615_070147/run_20260615_070203/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
    use_lines: false
    line_threshold: 0.10
device: "cuda"
unified_detection:
  imgsz: 0
  iou_threshold: 0.55
reid:
  backend: "prtreid"
tracking:
  reid_pitch_max_m: 0.8
  vis_frame_stride: 60
  dump_yolo_raw: false
  dump_ball_diag: false
jersey_recognition:
  enabled: true
  backend: claude
  model_id: "us.anthropic.claude-opus-4-7"
  region: "us-east-1"
track_consolidation:
  min_track_seconds: 1.0
  jersey:
    ocr_backend: llm
    ocr_batch_size: 4
    ocr_image_list: true
  frame_stride: 8
pipeline:
  stages:
  - field_registration
  - tracking
  - track_consolidation
  - event_detection
  - player_profile
