# clip_000_broadtrack.yaml
# Comments / rationale live in docs/config_notes.md (#clip_000_broadtrack.yaml).

video:
  process_fps: 0.1
field_registration:
  backend: "broadtrack"
  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260319_135637/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.25
    line_weights: "SV_lines"
    line_threshold: 0.5
    ransac_threshold: 30.0
  broadtrack:
    cauchy_f_scale: 5.0
    line_sample_points: 5
    line_weight: 1.0
    focal_candidates: [600, 800, 1000, 1300, 1600, 2000]
    max_nfev: 500
detection:
  model: "yolov8x"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 1280
ball_detection:
  enabled: true
  confidence_threshold: 0.3
tracking:
  algorithm: "strongsort"
  max_age: 50
reid:
  backend: "osnet"
  model: "osnet_x1_0"
team_classification:
  backend: "kmeans"
  position_weight: 0.1
device: "cuda"
