# kids_soccer.yaml
# Comments / rationale live in docs/config_notes.md (#kids_soccer.yaml).

video:
  process_fps: 10
intrinsics:
  fx: 2448.68
pitch_type: kids_soccer
field_registration:
  backend: "pnlcalib"
  pnlcalib_orig:
    enabled: true
  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260531_024941/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
    use_lines: true
    line_model_path: "data/finetuned_line_models/run_20260601_142205/models/best_model.pt"
    line_weights: "SV_lines"
    line_threshold: 0.10
    pnl_refine: true
    line_weight: 1.0
    geometric_outlier_filter:
      enabled: true
      ransac_threshold_px: 50.0
      min_keypoints: 6
  gap_filling:
    enabled: true
    method: improved
    smoothing_window: 5
    use_masking: false
    frame_step: 1
    max_gap_frames: 60
detection:
  model: "yolov8x"
  confidence_threshold: 0.4
  iou_threshold: 0.45
  imgsz: 1280
ball_detection:
  enabled: true
  confidence_threshold: 0.2
  field_filter:
    enabled: false
tracking:
  algorithm: "strongsort"
  max_age: 50
reid:
  backend: "osnet"
  model: "osnet_x1_0"
team_classification:
  backend: "kmeans"
  position_weight: 0.1
device: "cuda"
pipeline:
  stages:
  - field_registration
  - tracking
  - track_consolidation
  - event_detection
  - player_profile
