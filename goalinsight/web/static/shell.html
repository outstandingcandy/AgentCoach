<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GoalInsight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #101418; color: #e6e9ee;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    nav { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #262b33;
          background: #161b21; align-items: center; }
    nav a { color: #cfe3ff; text-decoration: none; padding: 6px 12px;
            border-radius: 6px; font-size: 14px; font-weight: 500; }
    nav a:hover { background: #1e242b; }
    nav .brand { color: #fff; font-weight: 700; margin-right: 12px; font-size: 15px; }
    main { flex: 1; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #101418; }
    .hint { margin-left: auto; font-size: 12px; color: #6b7380; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">GoalInsight</span>
    <a href="/library">Library</a>
    <a href="/annotate">Annotate</a>
    <a href="/pipeline">Pipeline</a>
    <span class="hint">Click a run in Library → Insights to open the viewer</span>
  </nav>
  <main>
    <iframe src="/library"></iframe>
  </main>
  <script>
    // Use anchor clicks to swap the iframe rather than top-navigate, so the
    // nav bar stays fixed across tabs.
    const frame = document.querySelector('iframe');
    document.querySelectorAll('nav a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        frame.src = a.getAttribute('href');
      });
    });
  </script>
</body>
</html>
