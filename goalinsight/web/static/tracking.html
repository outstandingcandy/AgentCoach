<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GoalInsight Tracking Diagnostics</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #101418; color: #e6e9ee;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr;
           grid-template-areas: "header header" "main aside"; height: 100vh; overflow: hidden; }
    header { grid-area: header; padding: 8px 16px; border-bottom: 1px solid #262b33;
             display: flex; gap: 18px; align-items: center; font-size: 13px; color: #9aa3ad; }
    header strong { color: #e6e9ee; margin-right: 4px; }
    header .pin { background: #1e242b; border: 1px solid #2a323c; padding: 4px 10px; border-radius: 6px;
                  color: #cfe3ff; font-weight: 600; }
    header .pin.empty { color: #6b7380; }
    #main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0;
            padding: 12px 16px; gap: 10px; overflow: hidden; }
    #slider-row { display: flex; gap: 10px; align-items: center; font-size: 12px; color: #9aa3ad; }
    #slider-row input[type=range] { flex: 1; accent-color: #3b82f6; }
    #frame-label { min-width: 90px; text-align: right; color: #cfe3ff; font-variant-numeric: tabular-nums; }
    #counts { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: #161b21;
              border: 1px solid #262b33; border-radius: 6px; font-size: 12px; }
    #counts .stat { display: flex; gap: 4px; align-items: baseline; }
    #counts .stat .lbl { color: #9aa3ad; }
    #counts .stat .val { color: #cfe3ff; font-weight: 600; font-variant-numeric: tabular-nums; }
    #image-pane { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
                  background: #000; border: 1px solid #262b33; border-radius: 6px; overflow: hidden; }
    #frame-img { max-width: 100%; max-height: 100%; image-rendering: -webkit-optimize-contrast; }
    #frame-img.empty { opacity: 0.3; }

    aside { grid-area: aside; display: flex; flex-direction: column; min-height: 0;
            border-left: 1px solid #262b33; background: #161b21; }
    .tabs { display: flex; border-bottom: 1px solid #262b33; }
    .tabs button { flex: 1; background: transparent; border: 0; color: #9aa3ad;
                   padding: 10px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
                   border-bottom: 2px solid transparent; }
    .tabs button.active { color: #cfe3ff; border-bottom-color: #3b82f6; }
    .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0; }
    .row { display: grid; grid-template-columns: 60px 1fr auto; gap: 6px; padding: 8px 14px;
           border-bottom: 1px solid #1e242b; font-size: 12px; cursor: pointer;
           align-items: center; }
    .row:hover { background: #1e242b; }
    .row.selected { background: #2a4661; }
    .row .tid { font-weight: 700; color: #cfe3ff; font-variant-numeric: tabular-nums; }
    .row .info { color: #9aa3ad; }
    .row .frame { color: #cfe3ff; font-variant-numeric: tabular-nums; font-weight: 600; }
    .row .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px;
                  background: #2a323c; color: #cfe3ff; margin-left: 6px; }
    .empty-state { padding: 40px 20px; text-align: center; color: #6b7380; font-size: 13px; }
    code { background: #0d1116; padding: 2px 6px; border-radius: 3px; color: #cfe3ff; }
  </style>
  <script defer src="/static/nav.js"></script>
</head>
<body>
  <header>
    <div><strong>Run:</strong><span id="run-name">…</span></div>
    <div><strong>Frames:</strong><span id="meta-frames">-</span></div>
    <div><strong>tids:</strong><span id="meta-tids">-</span></div>
    <div><strong>switches:</strong><span id="meta-switches">-</span></div>
    <div><strong>dropouts:</strong><span id="meta-dropouts">-</span></div>
    <div style="margin-left:auto"><span id="event-pin" class="pin empty">no event pinned</span></div>
  </header>

  <div id="main">
    <div id="slider-row">
      <input id="frame-slider" type="range" min="0" max="0" step="1" value="0" />
      <span id="frame-label">frame …</span>
    </div>
    <div id="counts"><span class="empty-state" style="padding:0">load…</span></div>
    <div id="image-pane">
      <img id="frame-img" class="empty" alt="diagnostic frame" />
    </div>
  </div>

  <aside>
    <div class="tabs">
      <button data-tab="dropouts" class="active">Dropouts</button>
      <button data-tab="switches">ID switches</button>
    </div>
    <div class="panel" id="panel-dropouts"><div class="empty-state">loading…</div></div>
    <div class="panel" id="panel-switches" style="display:none"><div class="empty-state">loading…</div></div>
  </aside>

<script>
"use strict";

// run_name from URL: /tracking/<run_name>
const RUN = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
document.getElementById("run-name").textContent = RUN;

const API = `/api/runs/${encodeURIComponent(RUN)}/tracking/diag`;

// State
let frameIndices = [];   // sorted sample frame indices
let curIdx = 0;          // index into frameIndices
let auditData = null;    // {dropouts, switches, ...}

const $ = (id) => document.getElementById(id);
const slider = $("frame-slider");
const frameLabel = $("frame-label");
const frameImg = $("frame-img");
const countsEl = $("counts");
const eventPin = $("event-pin");

// ------- Init -------
async function boot() {
  try {
    const summary = await fetchJSON(`${API}/summary`);
    frameIndices = summary.frame_indices || [];
    if (!frameIndices.length) {
      countsEl.innerHTML = `<span class="empty-state">no yolo_raw frames</span>`;
      return;
    }
    $("meta-frames").textContent = `${frameIndices.length} (stride ${
      frameIndices.length > 1 ? frameIndices[1] - frameIndices[0] : "?"})`;
    slider.min = 0;
    slider.max = frameIndices.length - 1;
    slider.value = 0;
    setFrame(0);

    // Audit panel — optional
    if (summary.audit_available) {
      try {
        auditData = await fetchJSON(`${API}/audit`);
        renderAudit();
      } catch (e) {
        console.warn("audit fetch failed", e);
        $("panel-dropouts").innerHTML = `<div class="empty-state">audit fetch failed: ${e.message}</div>`;
      }
    } else {
      $("panel-dropouts").innerHTML = `<div class="empty-state">no <code>track_audit.json</code><br/>run <code>scripts/audit_track_dropouts.py</code></div>`;
      $("panel-switches").innerHTML = $("panel-dropouts").innerHTML;
    }
  } catch (e) {
    console.error(e);
    countsEl.innerHTML = `<span class="empty-state">load failed: ${e.message}</span>`;
  }
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    try { const j = await r.json(); msg = j.detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// ------- Frame navigation -------
slider.addEventListener("input", () => {
  const i = parseInt(slider.value, 10);
  setFrame(i);
});

document.addEventListener("keydown", (e) => {
  // Ignore arrow keys when focus is in a text/textarea (none on this page,
  // but defensive for future inputs).
  const t = e.target;
  if (t && (t.tagName === "INPUT" && t.type !== "range" || t.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowLeft")  { stepFrame(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { stepFrame(+1); e.preventDefault(); }
  else if (e.key === "Home") { setFrame(0); slider.value = 0; e.preventDefault(); }
  else if (e.key === "End")  { const last = frameIndices.length - 1; setFrame(last); slider.value = last; e.preventDefault(); }
});

function stepFrame(delta) {
  const next = Math.max(0, Math.min(frameIndices.length - 1, curIdx + delta));
  if (next !== curIdx) {
    setFrame(next);
    slider.value = next;
  }
}

async function setFrame(i) {
  curIdx = i;
  const f = frameIndices[i];
  if (f === undefined) return;
  frameLabel.textContent = `frame ${f}  (${i + 1}/${frameIndices.length})`;
  // JPG (browser caches; prefer set src directly; bust via no-store header from server)
  const newSrc = `${API}/frames/${f}/jpg`;
  frameImg.src = newSrc;
  frameImg.classList.remove("empty");

  // Counts
  try {
    const rec = await fetchJSON(`${API}/frames/${f}`);
    const c = rec.counts || {};
    countsEl.innerHTML = `
      <span class="stat"><span class="lbl">raw</span><span class="val">${c.raw_players ?? "?"}</span></span>
      <span class="stat"><span class="lbl">conf</span><span class="val">${c.post_conf_players ?? "?"}</span></span>
      <span class="stat"><span class="lbl">size</span><span class="val">${c.post_size_players ?? "?"}</span></span>
      <span class="stat"><span class="lbl">pitch</span><span class="val">${c.post_pitch_players ?? "?"}</span></span>
      <span class="stat"><span class="lbl">balls</span><span class="val">${c.raw_balls ?? "?"}</span></span>
      <span class="stat"><span class="lbl">pose</span><span class="val">${rec.has_camera_pose ? "Y" : "N"}</span></span>`;
  } catch (e) {
    countsEl.innerHTML = `<span class="empty-state">frame counts: ${e.message}</span>`;
  }
}

// ------- Audit panel -------
function renderAudit() {
  if (!auditData) return;
  $("meta-tids").textContent = auditData.n_tids ?? "-";
  $("meta-switches").textContent = auditData.n_switches ?? "-";
  $("meta-dropouts").textContent = auditData.n_dropouts ?? "-";

  const dr = auditData.dropouts || [];
  const sw = auditData.switches || [];
  const pd = $("panel-dropouts");
  const ps = $("panel-switches");

  if (!dr.length) {
    pd.innerHTML = `<div class="empty-state">no dropouts found</div>`;
  } else {
    pd.innerHTML = dr.map((d, i) => `
      <div class="row" data-i="${i}" data-frame="${d.frame_gap}" data-tid="${d.tid}"
           data-before="${d.frame_before}" data-after="${d.frame_after}"
           data-kind="dropout">
        <span class="tid">tid ${d.tid}</span>
        <span class="info">gap [${d.frame_before}–${d.frame_after}]
          <span class="badge">${d.candidate_pitch_d.toFixed(1)} m</span>
          <span class="badge">conf ${d.candidate_conf.toFixed(2)}</span>
        </span>
        <span class="frame">@${d.frame_gap}</span>
      </div>`).join("");
  }
  if (!sw.length) {
    ps.innerHTML = `<div class="empty-state">no ID switches found</div>`;
  } else {
    ps.innerHTML = sw.map((s, i) => `
      <div class="row" data-i="${i}" data-frame="${s.frame_next}" data-tid="${s.tid}"
           data-before="${s.frame_prev}" data-after="${s.frame_next}"
           data-kind="switch">
        <span class="tid">tid ${s.tid}</span>
        <span class="info">jump <span class="badge">${s.jump_m.toFixed(2)} m</span>
          ${s.frame_prev}→${s.frame_next}
        </span>
        <span class="frame">@${s.frame_next}</span>
      </div>`).join("");
  }

  // Click handler: jump to frame_gap (or frame_next), pin the event
  document.querySelectorAll(".row").forEach((row) => {
    row.addEventListener("click", () => {
      document.querySelectorAll(".row.selected").forEach(r => r.classList.remove("selected"));
      row.classList.add("selected");
      const target = parseInt(row.dataset.frame, 10);
      const idx = nearestIndex(target);
      if (idx !== -1) {
        setFrame(idx);
        slider.value = idx;
      }
      const tid = row.dataset.tid;
      const before = row.dataset.before;
      const after = row.dataset.after;
      const kind = row.dataset.kind;
      eventPin.classList.remove("empty");
      eventPin.textContent = `${kind} · tid ${tid} · [${before}–${after}]  (← / → to bracket)`;
    });
  });
}

function nearestIndex(targetFrame) {
  // frameIndices is sorted; return the index whose value is closest to target
  if (!frameIndices.length) return -1;
  let lo = 0, hi = frameIndices.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (frameIndices[mid] < targetFrame) lo = mid + 1; else hi = mid;
  }
  // pick lo or lo-1, whichever is closer
  if (lo > 0 && Math.abs(frameIndices[lo - 1] - targetFrame) < Math.abs(frameIndices[lo] - targetFrame)) {
    return lo - 1;
  }
  return lo;
}

// Tab switching
document.querySelectorAll(".tabs button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const which = b.dataset.tab;
    $("panel-dropouts").style.display = which === "dropouts" ? "" : "none";
    $("panel-switches").style.display = which === "switches" ? "" : "none";
  });
});

boot();
</script>
</body>
</html>
