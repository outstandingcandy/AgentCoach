      const slider = document.querySelector(`[data-vis-slider="${chosenIdx}"]`);
      if (slider) {
        slider.value = String(i);
        slider.dispatchEvent(new Event('input', {bubbles: true}));
      }
      // Scroll the vis card into view so user sees the change.
      const visCard = document.querySelector('.vis-card');
      if (visCard) visCard.scrollIntoView({behavior: 'smooth', block: 'start'});
    }

    // Sparkline ticks are SVG <line> elements; make them clickable too.
    // Capture-phase listener so it runs before the row-toggle handler
    // and can stop propagation to it.
    document.addEventListener('click', (e) => {
      const svg = e.target.closest('svg');
      if (!svg || !svg.dataset.tidFrames) return;
      e.stopImmediatePropagation();   // don't toggle the row
      // Compute click x → nearest frame.
      const rect = svg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const w = rect.width;
      const frames = JSON.parse(svg.dataset.tidFrames);
      const minF = parseInt(svg.dataset.minFrame, 10);
      const maxF = parseInt(svg.dataset.maxFrame, 10);
      const span = Math.max(1, maxF - minF);
      const targetF = minF + Math.round((x / w) * span);
      // Snap to nearest frame in this tid's frame list.
      let best = frames[0], bestD = Infinity;
      for (const f of frames) {
        const d = Math.abs(f - targetF);
        if (d < bestD) { bestD = d; best = f; }
      }
      gotoFrame(best);
    }, true);  // capture phase

    function renderFiles(mf) {
      const files = mf.files || [];
      if (!files.length) return '';
      return `<div class="files-card">
        <h3 style="font-size:12px;color:#cfe3ff;text-transform:uppercase;margin:0 0 8px;letter-spacing:0.04em">Files</h3>
        <ul>
          ${files.map(f => {
            const url = `/runs_static/${encodeURIComponent(activeRun)}/${f.url}`;
            return `<li>
              <a href="${url}" target="_blank" rel="noopener">${escapeHTML(f.name)}</a>
              <span class="hint" style="font-size:11px">${escapeHTML(f.url)}</span>
              <span class="size">${fmtSize(f.size)}</span>
            </li>`;
          }).join('')}
        </ul>
      </div>`;
    }

    function renderTextFiles(mf) {
      const tf = mf.text_files || {};
      const entries = Object.entries(tf);
      if (!entries.length) return '';
      return entries.map(([name, content]) => `
        <div class="stats-card">
          <h3>${escapeHTML(name)}</h3>
          <pre class="text-card">${escapeHTML(content)}</pre>
        </div>`).join('');
    }

    // ---- Job launchers (unchanged from previous version) ----
    function selectedStages() {
      return [...document.querySelectorAll('#stage-list input[data-stage-cb]:checked')]
        .map(el => el.dataset.stageCb);
    }

    async function runPipeline() {
      if (!activeRun) return alert('Select a run first');
      const stages = selectedStages();
      if (!stages.length) return alert('Tick at least one stage checkbox');
      const config_path = $("#config-select").value;
      const keypoint_model = $("#keypoint-model-select").value || null;
      const skip_existing = $("#skip-existing").checked;
      const no_viz = $("#no-viz").checked;

      let runJson;
      try {
        runJson = await api('GET', `/api/library/runs/${encodeURIComponent(activeRun)}`);
      } catch { runJson = null; }
      let video_path = runJson?.video_path;
      if (!video_path) {
        const choice = prompt('Run has no recorded video_path. Enter a video name from the library:',
                              videos[0]?.name || '');
        if (!choice) return;
        const v = videos.find(v => v.name === choice);
        if (!v) return alert('No such video');
        video_path = v.path;
      }
      try {
        const job = await api('POST', '/api/jobs/pipeline', {
          run_name: activeRun, stages, config_path, video_path,
          skip_existing, no_viz, keypoint_model,
        });
        watchJob(job);
      } catch (e) { alert('Submit failed: ' + e.message); }
    }

    async function runRenderConsolidated() {
      if (!activeRun) return alert('Select a run first');
      let runJson;
      try {
        runJson = await api('GET', `/api/library/runs/${encodeURIComponent(activeRun)}`);
      } catch { runJson = null; }
      const video_path = runJson?.video_path
        || videos.find(v => v.name === prompt('Video name?'))?.path;
      if (!video_path) return;
      try {
        const job = await api('POST', '/api/jobs/render_consolidated', {
          run_name: activeRun, video_path,
        });
        watchJob(job);
      } catch (e) { alert('Submit failed: ' + e.message); }
    }

    async function submitTrain(kind) {
      const videoName = $(`#train-${kind === 'keypoint' ? 'kp' : 'line'}-video`).value;
      const pretrained = $(`#train-${kind === 'keypoint' ? 'kp' : 'line'}-pretrained`).value.trim();
      const remote = $(`#train-${kind === 'keypoint' ? 'kp' : 'line'}-remote`).checked;
      if (!videoName || !pretrained) return alert('video + pretrained required');
      const stem = videoName.replace(/\.[^.]+$/, '');
      try {
        const job = await api('POST', '/api/jobs/train', {
          kind,
          annotations_dir: `workspace/annotations/${stem}`,
          pretrained,
          remote,
        });
        watchJob(job);
      } catch (e) { alert('Submit failed: ' + e.message); }
    }

    let activeJobES = null;
    let activeJobId = null;

    function setStopButton(running) {
      const btn = $("#stop-pipeline");
      const hint = $("#stop-hint");
      if (running) {
        btn.disabled = false;
        btn.textContent = 'Stop';
        hint.textContent = '';
      } else {
        btn.disabled = true;
        btn.textContent = 'Stop';
        hint.textContent = '';
      }
    }

    async function stopPipeline() {
      if (!activeJobId) return;
      const btn = $("#stop-pipeline");
      const hint = $("#stop-hint");
      if (!confirm(
        'Stop the pipeline?\n\n' +
        'The current stage will run to completion (loops inside ' +
        'tracking/calibration can\'t be interrupted), then later stages ' +
        'are skipped. Stages already done remain on disk; rerunning ' +
        'with --skip-existing picks up where this stopped.'
      )) return;
      btn.disabled = true;
      btn.textContent = 'Stopping…';
      hint.textContent = 'request sent — waiting for current stage to finish';
      try {
        await api('POST', `/api/jobs/${activeJobId}/cancel`);
      } catch (e) {
        hint.textContent = `cancel failed: ${e.message}`;
        btn.disabled = false;
        btn.textContent = 'Stop';
      }
    }

    function watchJob(job) {
      if (activeJobES) { activeJobES.close(); activeJobES = null; }
      activeJobId = job.id;
      $("#job-title").textContent = `${job.kind}${job.run_name ? ' · ' + job.run_name : ''}`;
      $("#job-id-hint").textContent = `id ${job.id}`;
      $("#job-status").textContent = job.status;
      $("#log-pane").textContent = '';
      // Auto-expand the log section when a new job starts streaming so
      // the user sees output immediately. Stays expanded until they
      // collapse it.
      $("#log-section").classList.remove('collapsed');
      setStopButton(true);

      const es = new EventSource(`/api/jobs/${job.id}/stream`);
      activeJobES = es;
      es.onmessage = (e) => {
        try {
          const obj = JSON.parse(e.data);
          if (obj.log) {
            const pane = $("#log-pane");
            pane.textContent += obj.log;
            pane.scrollTop = pane.scrollHeight;
          }
          if (obj.status) {
            $("#job-status").textContent = obj.status;
            // Terminal states close the stream and the Stop button.
            const terminal = ['done', 'failed', 'cancelled'];
            if (terminal.includes(obj.status)) {
              es.close();
              activeJobId = null;
              setStopButton(false);
              refreshAll();
              if (obj.result) {
                $("#log-pane").textContent += '\n--- result ---\n' + JSON.stringify(obj.result, null, 2);
              }
              if (obj.error) {
                $("#log-pane").textContent += '\n--- error ---\n' + obj.error;
              }
            }
          }
        } catch (err) { /* ignore frame */ }
      };
      es.onerror = () => {
        es.close();
        activeJobES = null;
        // SSE errors don't necessarily mean the job died — keep the
        // Stop button live; a subsequent /api/jobs/<id> poll on
        // refreshAll() will resync the status.
      };
    }

    // Re-attach to a running job that was launched in another tab /
    // session. Without this the Stop button stays disabled on a fresh
    // pipeline page load even though a pipeline is actively running.
    async function attachActiveJob() {
      if (!activeRun) return;
      let jobs;
      try { jobs = await api('GET', '/api/jobs'); }
      catch { return; }
      const running = (jobs || [])
        .filter(j => j.status === 'running'
                     && j.kind === 'pipeline'
                     && j.run_name === activeRun)
        .sort((a, b) => (b.started_at || 0) - (a.started_at || 0))[0];
      if (!running) return;
      // Attach silently — don't replay the entire log (the SSE stream
      // only delivers new lines; full log is /api/jobs/<id>/log).
      try {
        const txt = await fetch(`/api/jobs/${running.id}/log`).then(r => r.text());
        watchJob(running);
        if (txt) $("#log-pane").textContent = txt;
      } catch {
        watchJob(running);
      }
    }

    refreshAll().then(attachActiveJob);
  </script>
</body>
</html>
