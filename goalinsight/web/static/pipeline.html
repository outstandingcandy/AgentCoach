<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GoalInsight — Pipeline</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #101418; color: #e6e9ee;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: grid; grid-template-columns: 380px 1fr; height: 100vh;
           overflow: hidden; }
    #left { padding: 16px; overflow-y: auto; border-right: 1px solid #262b33; }
    #right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    h1, h2 { margin: 0 0 10px; color: #fff; font-weight: 600; }
    h1 { font-size: 18px; }
    h2 { font-size: 13px; color: #cfe3ff; margin-top: 18px; text-transform: uppercase;
         letter-spacing: 0.04em; }
    .stage { background: #161b21; border: 1px solid #262b33; border-radius: 8px;
             padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
             transition: border-color 0.1s, background 0.1s; }
    .stage:hover { border-color: #3b82f6; }
    .stage.active { border-color: #3b82f6; background: #1e2a3a; }
    .stage label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .stage .name { font-weight: 600; color: #fff; }
    .stage .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px;
                    background: #14532d; color: #86efac; margin-left: auto; }
    .stage .badge.pending { background: #1e242b; color: #6b7380; border: 1px solid #2a323c; }
    button { background: #3b82f6; color: white; border: 0; border-radius: 6px;
             padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #2563eb; }
    button:disabled { background: #2a323c; color: #6b7380; cursor: not-allowed; }
    button.secondary { background: #2a323c; color: #cfe3ff; }
    button.secondary:hover { background: #364250; }
    button.tiny { padding: 4px 8px; font-size: 11px; font-weight: 500; }
    select, input { background: #0d1116; color: #e6e9ee; border: 1px solid #2a323c;
                    border-radius: 6px; padding: 7px; font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .train-card { background: #161b21; border: 1px solid #262b33;
                  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .train-card .name { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .train-card .actions { display: flex; gap: 6px; margin-top: 8px; }
    .hint { color: #6b7380; font-size: 12px; }

    /* Right pane split: stage panel on top, job log on bottom.
       The job log starts collapsed (just its header bar) so the stage
       panel gets the full viewport on page load; user toggles by
       clicking the chevron / anywhere on the header. */
    #right > #stage-pane { flex: 1 1 auto; min-height: 0; overflow-y: auto;
                           padding: 14px 16px; }
    #right > #log-section { flex: 0 0 auto; display: flex; flex-direction: column;
                            border-top: 1px solid #262b33; min-height: 0;
                            max-height: 50vh; }
    #right > #log-section.collapsed { flex: 0 0 auto; max-height: none; }
    #right > #log-section.collapsed #log-pane { display: none; }
    #right > #log-section:not(.collapsed) { flex: 0 0 280px; }
    #right-header { padding: 10px 14px; border-bottom: 1px solid #262b33;
                    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
                    background: #0d1116; cursor: pointer; user-select: none; }
    #right-header strong { color: #fff; font-weight: 600; }
    #right-header .chevron { color: #9aa3ad; transition: transform 0.15s;
                             font-size: 11px; }
    #right > #log-section.collapsed #right-header .chevron { transform: rotate(-90deg); }
    #log-pane { flex: 1; overflow-y: auto; background: #0d1116;
                font-family: ui-monospace, "SF Mono", monospace; font-size: 12px;
                padding: 10px 14px; white-space: pre-wrap; color: #cfe3ff;
                min-height: 0; }

    /* Stage results panel */
    .panel-empty { padding: 60px 20px; text-align: center; color: #6b7380;
                   font-size: 13px; }
    .stage-title { display: flex; gap: 12px; align-items: baseline;
                   border-bottom: 1px solid #262b33; padding-bottom: 8px;
                   margin-bottom: 14px; }
    .stage-title h2 { margin: 0; color: #fff; font-size: 18px;
                      text-transform: none; letter-spacing: 0; }
    .stage-title .pill { background: #1e242b; border: 1px solid #2a323c;
                         padding: 2px 8px; border-radius: 999px;
                         font-size: 11px; color: #9aa3ad; }
    .stats-card { background: #161b21; border: 1px solid #262b33;
                  border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .stats-card h3 { margin: 0 0 8px; font-size: 12px; color: #cfe3ff;
                     text-transform: uppercase; letter-spacing: 0.04em; }
    .stats-grid { display: grid;
                  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                  gap: 8px; font-size: 12px; }
    .stats-grid .kv { background: #0d1116; padding: 6px 8px; border-radius: 4px; }
    .stats-grid .kv .k { color: #9aa3ad; font-size: 11px; }
    .stats-grid .kv .v { color: #cfe3ff; font-weight: 600; font-variant-numeric: tabular-nums;
                         word-break: break-word; }

    .vis-card { background: #161b21; border: 1px solid #262b33;
                border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .vis-tabs { display: flex; border-bottom: 1px solid #262b33;
                background: #0d1116; flex-wrap: wrap; }
    .vis-tabs button { background: transparent; color: #9aa3ad; border: 0;
                       padding: 9px 14px; font-weight: 600; font-size: 12px;
                       cursor: pointer; border-bottom: 2px solid transparent; }
    .vis-tabs button.active { color: #cfe3ff; border-bottom-color: #3b82f6; }
    .vis-mode-toggle button { background: #1f2730; color: #9aa3ad; border: 1px solid #2a323c;
      border-radius: 3px; cursor: pointer; }
    .vis-mode-toggle button.active { background: #2c3a52; color: #cfe3ff;
      border-color: #3b82f6; }
    .vis-body { padding: 12px; }
    .vis-slider-row { display: flex; gap: 10px; align-items: center;
                      font-size: 12px; color: #9aa3ad; margin-bottom: 8px; }
    .vis-slider-row input[type=range] { flex: 1; accent-color: #3b82f6; }
    .vis-frame-label { min-width: 130px; text-align: right;
                       color: #cfe3ff; font-variant-numeric: tabular-nums; }
    .vis-img-wrap { background: #000; border-radius: 6px;
                    overflow: hidden; line-height: 0;
                    text-align: center; }
    /* Cap by height *and* width but never break aspect ratio.
       ``max-height:70vh`` alone (with ``width:100%``) made the
       browser clamp height while keeping width 100%, squishing the
       picture on wide viewports. Using width:auto + max-* lets the
       browser size by whichever dimension hits its cap first. */
    .vis-img-wrap img { display: inline-block; width: auto; height: auto;
                        max-width: 100%; max-height: 70vh; }

    .files-card { background: #161b21; border: 1px solid #262b33;
                  border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .files-card ul { list-style: none; padding: 0; margin: 0;
                     font-family: ui-monospace, "SF Mono", monospace;
                     font-size: 12px; }
    .files-card li { padding: 4px 0; display: flex; gap: 8px; align-items: center; }
    .files-card a { color: #93c5fd; text-decoration: none; }
    .files-card a:hover { text-decoration: underline; }
    .files-card .size { color: #6b7380; font-size: 11px; margin-left: auto; }

    .text-card { background: #0d1116; border: 1px solid #262b33;
                 border-radius: 8px; padding: 12px; margin-bottom: 14px;
                 font-family: ui-monospace, "SF Mono", monospace; font-size: 12px;
                 color: #cfe3ff; max-height: 320px; overflow-y: auto;
                 white-space: pre-wrap; }

    .events-list { font-size: 12px; max-height: 200px; overflow-y: auto; }
    .events-list .ev { padding: 4px 0; border-bottom: 1px solid #1e242b;
                       display: grid; grid-template-columns: 70px 90px 1fr; gap: 6px; }
    .events-list .ev .t { color: #6b7380; }
    .events-list .ev .ty { color: #cfe3ff; font-weight: 600; }
    .events-list .ev .meta { color: #9aa3ad; }

    table.calib-kp { width: 100%; border-collapse: collapse; font-size: 12px;
                     max-height: 340px; }
    table.calib-kp th { text-align: left; color: #6b7380; font-weight: 600;
                        padding: 4px 8px; border-bottom: 1px solid #262b33; }
    table.calib-kp td { padding: 3px 8px; border-bottom: 1px solid #1e242b;
                        color: #d4dae0; }
    table.calib-kp tbody tr:hover { background: #1a2027; }

    .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                  gap: 6px; }
    .thumb-grid img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px;
                      border: 1px solid #262b33; }
    .thumb-grid .thumb-label { font-size: 10px; color: #9aa3ad; text-align: center;
                               margin-top: 2px; word-break: break-all; }
    .thumb-grid img.thumb-jump:hover { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
    /* Per-crop OCR result rendered under each thumb. ``.ocr-hit`` for
       crops that produced a clean digit reading (highlighted), .ocr-miss
       for crops where OCR ran but didn't return a parseable number. */
    .thumb-grid .thumb-ocr { font-size: 10px; text-align: center;
                             margin-top: 1px; padding: 1px 4px;
                             border-radius: 3px; line-height: 1.2;
                             font-family: ui-monospace, 'SF Mono', monospace; }
    .thumb-grid .thumb-ocr.ocr-hit { color: #cfe3ff; background: #14304b;
                                     font-weight: 600; }
    .thumb-grid .thumb-ocr.ocr-miss { color: #6b7380; background: #1a1f25;
                                      font-style: italic; }

    /* Per-orig collapsible block. Default closed. */
    details.orig-block { background: #0d1116; border: 1px solid #2a323c;
                         border-radius: 5px; padding: 4px 6px; }
    details.orig-block > summary { user-select: none; }
    details.orig-block > summary::-webkit-details-marker { display: none; }
    details.orig-block > summary:hover { background: #1e242b; }
    details.orig-block[open] > summary .caret { transform: rotate(90deg); }
  </style>
  <script defer src="/static/nav.js"></script>
</head>
<body>
  <div id="left">
    <h1>Pipeline</h1>
    <div class="row">
      <select id="run-select"></select>
      <button class="secondary" onclick="refreshAll()">Refresh</button>
    </div>
    <div class="hint" id="run-hint"></div>

    <h2>Run stages</h2>
    <div id="stage-list"></div>
    <div class="row">
      <label><input type="checkbox" id="run-checkbox-toggle" onchange="toggleCheckboxes()" checked>Show launch checkboxes</label>
    </div>
    <div id="launch-controls">
      <div class="row">
        <label><input type="checkbox" id="skip-existing" checked> --skip-existing</label>
        <label><input type="checkbox" id="no-viz"> --no-viz</label>
      </div>
      <div class="row">
        <select id="config-select"></select>
        <select id="keypoint-model-select">
          <option value="">(use config default)</option>
        </select>
      </div>
      <div class="row">
        <button onclick="runPipeline()">Run selected</button>
        <button id="stop-pipeline" class="secondary" onclick="stopPipeline()" disabled>Stop</button>
        <span class="hint" id="stop-hint" style="font-size:11px;color:#9aa3ad"></span>
      </div>
    </div>

    <h2>Render consolidated</h2>
    <div class="train-card">
      <div class="name">render_consolidated_tracking</div>
      <div class="hint">Output: track_consolidation/players_overlay.mp4</div>
      <div class="actions">
        <button onclick="runRenderConsolidated()">Render</button>
      </div>
    </div>

    <h2>Train (fine-tune PnLCalib)</h2>
    <div class="train-card">
      <div class="name">finetune_keypoints</div>
      <div class="row">
        <select id="train-kp-video"></select>
        <input type="text" id="train-kp-pretrained" placeholder="path to pretrained .pt" style="flex:1">
      </div>
      <div class="row">
        <label><input type="checkbox" id="train-kp-remote"> --remote (SageMaker)</label>
      </div>
      <div class="actions">
        <button onclick="submitTrain('keypoint')">Train keypoints</button>
      </div>
    </div>
    <div class="train-card">
      <div class="name">finetune_lines</div>
      <div class="row">
        <select id="train-line-video"></select>
        <input type="text" id="train-line-pretrained" placeholder="path to pretrained .pt" style="flex:1">
      </div>
      <div class="row">
        <label><input type="checkbox" id="train-line-remote"> --remote</label>
      </div>
      <div class="actions">
        <button onclick="submitTrain('line')">Train lines</button>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="stage-pane">
      <div class="panel-empty">Click a stage in the left panel to inspect its results.</div>
    </div>
    <div id="log-section" class="collapsed">
      <div id="right-header" onclick="document.getElementById('log-section').classList.toggle('collapsed')">
        <span class="chevron">▾</span>
        <strong id="job-title">No job</strong>
        <span class="hint" id="job-status"></span>
        <span class="hint" style="margin-left:auto" id="job-id-hint"></span>
      </div>
      <div id="log-pane">Job logs will stream here.</div>
    </div>
  </div>

  <script>
    "use strict";
    const $ = (q) => document.querySelector(q);

    const STAGES = [
      'field_registration', 'tracking', 'track_consolidation',
      'event_detection', 'player_profile',
      'annotated_video', 'highlights',
    ];

    const params = new URLSearchParams(location.search);
    let activeRun = params.get('run') || '';
    let activeStage = params.get('stage') || '';
    let runs = [], videos = [], configs = [];

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      const data = r.headers.get('content-type')?.includes('json')
                   ? await r.json() : await r.text();
      if (!r.ok) throw new Error((data && data.detail) || r.statusText);
      return data;
    }

    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderStages(run) {
      const stages = run?.stages || {};
      const list = $("#stage-list");
      list.innerHTML = STAGES.map(s => `
        <div class="stage${activeStage === s ? ' active' : ''}" data-stage="${s}">
          <label>
            <input type="checkbox" data-stage-cb="${s}" onclick="event.stopPropagation()">
            <span class="name">${s}</span>
            <span class="badge ${stages[s] ? '' : 'pending'}">${stages[s] ? 'done' : 'pending'}</span>
          </label>
        </div>`).join('');
      list.querySelectorAll('.stage').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.tagName === 'INPUT') return;
          activeStage = el.dataset.stage;
          renderStages(run);
          loadStagePane();
          const u = new URL(location);
          u.searchParams.set('stage', activeStage);
          history.replaceState({}, '', u);
        });
      });
    }

    function toggleCheckboxes() {
      const show = $("#run-checkbox-toggle").checked;
      $("#launch-controls").style.display = show ? '' : 'none';
      document.querySelectorAll('[data-stage-cb]').forEach(cb => {
        cb.style.display = show ? '' : 'none';
      });
    }

    async function refreshAll() {
      [runs, videos, configs] = await Promise.all([
        api('GET', '/api/library/runs'),
        api('GET', '/api/library/videos'),
        api('GET', '/api/library/configs'),
      ]);
      const runSelect = $("#run-select");
      runSelect.innerHTML = runs.length
        ? runs.map(r => {
            const sel = r.run_name === activeRun ? ' selected' : '';
            return `<option value="${r.run_name}"${sel}>${r.run_name}</option>`;
          }).join('')
        : '<option value="">(no runs — create one in Library)</option>';
      activeRun = runSelect.value || '';

      // Render the config list now; selectConfigForRun overrides the
      // selection once the run's recorded config_path is fetched.
      const cfgSelect = $("#config-select");
      cfgSelect.innerHTML = configs.map(c =>
        `<option value="${c.path}">${c.name}</option>`).join('');

      $("#train-kp-video").innerHTML = videos.map(v =>
        `<option value="${v.name}">${v.name}</option>`).join('');
      $("#train-line-video").innerHTML = videos.map(v =>
        `<option value="${v.name}">${v.name}</option>`).join('');

      const r = runs.find(r => r.run_name === activeRun);
      renderStages(r);
      $("#run-hint").textContent = activeRun ? `Run dir: workspace/runs/${activeRun}` : '';
      if (activeStage) loadStagePane();
      await selectConfigForRun(activeRun);
    }

    // Pre-select the dropdown to whatever config_path the active run
    // was created with, so re-running uses the same config the
    // initial run did. Falls back to default.yaml when run.json is
    // missing or doesn't list a config.
    async function selectConfigForRun(runName) {
      const cfgSelect = $("#config-select");
      let target = null;
      if (runName) {
        try {
          const meta = await api('GET', `/api/library/runs/${encodeURIComponent(runName)}`);
          if (meta && meta.config_path) target = meta.config_path;
        } catch {}
      }
      if (target) {
        // Match by full path; fall back to basename if the run was
        // recorded with a path the current configs list doesn't expose.
        let opt = [...cfgSelect.options].find(o => o.value === target);
        if (!opt) {
          const base = target.split('/').pop();
          opt = [...cfgSelect.options].find(o => o.textContent === base);
        }
        if (opt) { cfgSelect.value = opt.value; return; }
      }
      // No recorded config — keep the historical default.
      const def = [...cfgSelect.options].find(o => o.textContent === 'default.yaml');
      if (def) cfgSelect.value = def.value;
    }

    $("#run-select")?.addEventListener('change', e => {
      activeRun = e.target.value;
      const r = runs.find(r => r.run_name === activeRun);
      renderStages(r);
      $("#run-hint").textContent = activeRun ? `Run dir: workspace/runs/${activeRun}` : '';
      const u = new URL(location);
      u.searchParams.set('run', activeRun);
      history.replaceState({}, '', u);
      if (activeStage) loadStagePane();
      selectConfigForRun(activeRun);
    });

    // ---- Stage results pane ----
    async function loadStagePane() {
      const pane = $("#stage-pane");
      if (!activeRun || !activeStage) {
        pane.innerHTML = `<div class="panel-empty">Click a stage to inspect its results.</div>`;
        return;
      }
      pane.innerHTML = `<div class="panel-empty">Loading ${escapeHTML(activeStage)}…</div>`;
      let mf;
      try {
        mf = await api('GET',
          `/api/runs/${encodeURIComponent(activeRun)}/pipeline/stage/${encodeURIComponent(activeStage)}`);
      } catch (e) {
        pane.innerHTML = `<div class="panel-empty">Failed to load: ${escapeHTML(e.message)}</div>`;
        return;
      }
      renderStagePane(mf);
    }

    function renderStagePane(mf) {
      // Stop any ongoing frame-playback in the previous pane.
      if (typeof window._stopAllVisPlay === 'function') window._stopAllVisPlay();
      const pane = $("#stage-pane");
      if (!mf.exists) {
        pane.innerHTML = `<div class="stage-title"><h2>${escapeHTML(mf.stage)}</h2>
          <span class="pill">not run</span></div>
          <div class="panel-empty">Stage directory missing on disk.</div>`;
        return;
      }
      const parts = [];
      parts.push(renderStageHeader(mf));
      parts.push(renderStats(mf));
      parts.push(renderCalibrationInputs(mf));
      parts.push(renderVis(mf));
      parts.push(renderEventList(mf));
      parts.push(renderLLMScene(mf));
      parts.push(renderThumbsGrid(mf));
      parts.push(renderTrackLifetimes(mf));
      parts.push(renderFiles(mf));
      parts.push(renderTextFiles(mf));
      pane.innerHTML = parts.filter(Boolean).join('');
      wireVisHandlers();
      wireCalibrationInputs(mf);
      // Restore per-player checkbox state after the panel was rebuilt.
      document.querySelectorAll('[data-pid-toggle]').forEach((cb) => {
        if (_selectedPlayers.has(cb.dataset.pidToggle)) cb.checked = true;
      });
      // Honor `#expand=<tid>` hash for deep-linking into a specific
      // orig-tid's frame list (also useful for screenshot tests).
      const m = /#expand=(\d+)/.exec(location.hash || '');
      if (m) {
        const target = m[1];
        const trs = document.querySelectorAll('tr[data-detail]');
        for (const tr of trs) {
          if (tr.querySelector('td')?.textContent.trim() === target) {
            tr.click();
            tr.scrollIntoView({behavior: 'smooth', block: 'center'});
            break;
          }
        }
      }
    }

    function renderStageHeader(mf) {
      let counts = '';
      const ndirs = (mf.vis_dirs || []).length;
      if (ndirs) counts += `<span class="pill">${ndirs} vis dir${ndirs > 1 ? 's' : ''}</span>`;
      const nfiles = (mf.files || []).length;
      if (nfiles) counts += `<span class="pill">${nfiles} file${nfiles > 1 ? 's' : ''}</span>`;
      return `<div class="stage-title">
        <h2>${escapeHTML(mf.stage)}</h2>
        ${counts}
      </div>`;
    }

    function fmtVal(v) {
      if (v === null || v === undefined) return '—';
      if (typeof v === 'number') {
        if (Number.isInteger(v)) return v.toLocaleString();
        return v.toFixed(Math.abs(v) < 1 ? 4 : 2);
      }
      if (Array.isArray(v)) return `[${v.length}]`;
      if (typeof v === 'object') return JSON.stringify(v).slice(0, 60);
      return String(v);
    }

    function renderStats(mf) {
      const stats = mf.stats || {};
      const entries = Object.entries(stats).filter(
        ([k]) => !k.startsWith('_'));  // skip private fields like _events, _track_thumbs
      if (!entries.length) return '';
      return `<div class="stats-card">
        <h3>Stats</h3>
        <div class="stats-grid">
          ${entries.map(([k, v]) => `
            <div class="kv">
              <div class="k">${escapeHTML(k)}</div>
              <div class="v" title="${escapeHTML(JSON.stringify(v))}">${escapeHTML(fmtVal(v))}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }

    // ---- Calibration inputs (field_registration only) ---------------
    // Shows, per selected frame, exactly which keypoints fed the camera
    // solve — id + landmark name + pixel coords + detector confidence —
    // alongside that frame's calibration-quality numbers (reprojection /
    // world error, inliers). The baked JPGs already draw the points; this
    // exposes the underlying values the solver actually consumed.
    function renderCalibrationInputs(mf) {
      if (mf.stage !== 'field_registration') return '';
      const frames = mf.stats?._calibration_frames;
      if (!Array.isArray(frames) || !frames.length) return '';
      const opts = frames.map((f, i) =>
        `<option value="${f}"${i === 0 ? ' selected' : ''}>frame ${f}</option>`).join('');
      return `<div class="stats-card" id="calib-inputs-card">
        <h3>Calibration inputs
          <span style="color:#6b7380;font-weight:normal;font-size:12px">
            — keypoints fed to the solve, per frame
          </span>
        </h3>
        <div class="vis-slider-row" style="margin-bottom:8px">
          <label style="color:#9aa3ad;font-size:12px">Frame</label>
          <select id="calib-frame-select" style="padding:2px 6px">${opts}</select>
          <span id="calib-frame-quality" style="color:#9aa3ad;font-size:12px"></span>
        </div>
        <div id="calib-kp-table"><div class="panel-empty">Loading…</div></div>
      </div>`;
    }

    function wireCalibrationInputs(mf) {
      if (mf.stage !== 'field_registration') return;
      const sel = document.getElementById('calib-frame-select');
      if (!sel) return;
      const digits = mf.stats?._calibration_digits || 5;
      const names = mf.stats?._keypoint_names || {};
      const load = () => loadCalibrationFrame(parseInt(sel.value, 10), digits, names);
      sel.addEventListener('change', load);
      load();  // initial
    }

    const _calibFrameCache = new Map();   // frame → sidecar json

    async function loadCalibrationFrame(frame, digits, names) {
      const table = document.getElementById('calib-kp-table');
      const quality = document.getElementById('calib-frame-quality');
      if (!table) return;
      const sample = String(frame).padStart(digits, '0');
      const url = `/runs_static/${encodeURIComponent(activeRun)}`
                + `/field_registration/visualizations/calibration/frame_${sample}.json`;
      let json = _calibFrameCache.get(frame);
      if (!json) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`status ${resp.status}`);
          json = await resp.json();
          _calibFrameCache.set(frame, json);
        } catch (e) {
          table.innerHTML = `<div class="panel-empty">No calibration data for this frame.</div>`;
          if (quality) quality.textContent = '';
          return;
        }
      }

      // Quality line: reprojection / world error, inliers, focal, flags.
      if (quality) {
        const bits = [];
        if (json.reprojection_error != null)
          bits.push(`reproj ${(+json.reprojection_error).toFixed(1)}px`);
        if (json.world_error != null)
          bits.push(`world ${(+json.world_error).toFixed(2)}m`);
        if (json.inliers != null && json.total_points != null)
          bits.push(`inliers ${json.inliers}/${json.total_points}`);
        const f = json.camera?.focal_length;
        if (f != null) bits.push(`f ${(+f).toFixed(0)}px`);
        if (json.warm_start) bits.push('warm-start');
        if (json.calibrated === false) bits.push('⚠ not calibrated');
        quality.textContent = bits.length ? '· ' + bits.join('  ·  ') : '';
      }

      const kps = json.detected_keypoints || [];
      const lines = json.detected_lines || [];
      if (!kps.length && !lines.length) {
        table.innerHTML = `<div class="panel-empty">
          No keypoints/lines detected on this frame
          (calibration ${json.warm_start ? 'carried by warm-start pose' : 'may be interpolated'}).
        </div>`;
        return;
      }
      const rows = kps
        .slice()
        .sort((a, b) => (b.confidence ?? 0) - (a.confidence ?? 0))
        .map(kp => {
          const nm = kp.class_name || names[kp.id] || '';
          const conf = kp.confidence != null ? (+kp.confidence).toFixed(2) : '—';
          const lowConf = kp.confidence != null && kp.confidence < 0.4;
          return `<tr${lowConf ? ' style="opacity:0.6"' : ''}>
            <td style="font-family:ui-monospace,monospace">${kp.id}</td>
            <td style="color:#cfe3ff">${escapeHTML(nm)}</td>
            <td style="font-family:ui-monospace,monospace">${(+kp.x).toFixed(0)}, ${(+kp.y).toFixed(0)}</td>
            <td style="font-family:ui-monospace,monospace">${conf}</td>
          </tr>`;
        }).join('');
      const lineNote = lines.length
        ? `<div style="color:#9aa3ad;font-size:12px;margin-top:6px">
             + ${lines.length} line constraint${lines.length > 1 ? 's' : ''}</div>`
        : '';
      table.innerHTML = `
        <table class="calib-kp">
          <thead><tr>
            <th>id</th><th>landmark</th><th>pixel (x, y)</th><th>conf</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div style="color:#9aa3ad;font-size:12px;margin-top:6px">
          ${kps.length} keypoint${kps.length > 1 ? 's' : ''} detected;
          ${json.inliers ?? '?'}/${json.total_points ?? '?'} used as PnP inliers.
        </div>
        ${lineNote}`;
    }

    function renderVis(mf) {
      const vis = mf.vis_dirs || [];
      if (!vis.length) {
        // Fallback: if no frames dir but a stage mp4 exists, embed it.
        const mp4 = (mf.files || []).find(f => f.url.endsWith('.mp4'));
        if (mp4) {
          return `<div class="vis-card">
            <div class="vis-body">
              <video controls preload="metadata" style="width:100%;max-height:70vh;background:#000"
                     src="/runs_static/${encodeURIComponent(activeRun)}/${mp4.url}"></video>
            </div>
          </div>`;
        }
        return '';
      }
      const tabs = vis.map((vd, i) => `
        <button data-vis-tab="${i}" class="${i === 0 ? 'active' : ''}">
          ${escapeHTML(vd.name)} (${vd.frames.length})
        </button>`).join('');
      const bodies = vis.map((vd, i) => renderVisBody(vd, i)).join('');
      return `<div class="vis-card">
        <div class="vis-tabs">${tabs}</div>
        ${bodies}
      </div>`;
    }

    function renderVisBody(vd, index) {
      if (!vd.frames.length) {
        return `<div class="vis-body" data-vis-body="${index}"
                     style="display:${index === 0 ? '' : 'none'}">
          <div class="panel-empty">No frames</div>
        </div>`;
      }
      const first = vd.frames[0];
      const pad = vd.digits || 5;
      const ext = vd.ext || '.jpg';
      const sample = String(first).padStart(pad, '0');
      const url = `/runs_static/${encodeURIComponent(activeRun)}/${vd.url_prefix}/frame_${sample}${ext}`;
      // Only the consolidation "frames" pane gets the JSON-sidecar
      // overlay path (clean JPGs + per-frame tracks JSON). Other vis
      // panes show baked overlays as before.
      const hasOverlay = vd.url_prefix.startsWith('track_consolidation/frames');
      // Inline playback: ▶/⏸ button + fps + resolution. Resolution
      // is appended as ``?w=720|1080|1920|3840``; the server-side
      // ``/runs_static`` handler downscales 4K source jpgs on the
      // fly (cached). 1080p ≈ 250 KB / frame, easy to play at 10 fps.
      const overlayControls = hasOverlay ? `
        <div class="vis-slider-row" style="margin-top:4px">
          <span style="color:#9aa3ad;font-size:11px">
            Toggle a player below to overlay their bbox. Click frame to zoom.
          </span>
          <button data-vis-overlay-clear="${index}" style="padding:2px 8px;font-size:11px">Clear selection</button>
        </div>` : '';
      return `<div class="vis-body" data-vis-body="${index}"
                   style="display:${index === 0 ? '' : 'none'}">
        <div class="vis-slider-row">
          <button data-vis-play="${index}" style="padding:3px 10px">▶</button>
          <select data-vis-fps="${index}" style="padding:2px 4px" title="frames per second">
            <option value="5">5 fps</option>
            <option value="10" selected>10 fps</option>
            <option value="15">15 fps</option>
            <option value="30">30 fps</option>
          </select>
          <select data-vis-res="${index}" style="padding:2px 4px" title="image resolution">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1920">1920px</option>
            <option value="">original</option>
          </select>
          <input type="range" min="0" max="${vd.frames.length - 1}" value="0"
                 data-vis-slider="${index}" style="flex:1">
          <span class="vis-frame-label" data-vis-label="${index}">
            frame ${first}  (1/${vd.frames.length})
          </span>
        </div>
        ${overlayControls}
        <div class="vis-img-wrap" data-vis-wrap="${index}"
             style="position:relative;display:inline-block;${hasOverlay ? 'cursor:zoom-in' : ''}">
          <img data-vis-img="${index}" src="${url}?w=1080" alt="frame">
          ${hasOverlay ? `<svg data-vis-svg="${index}" preserveAspectRatio="none"
                  style="position:absolute;left:0;top:0;width:100%;height:100%;
                         pointer-events:none;overflow:visible"></svg>` : ''}
        </div>
      </div>`;
    }

    function wireVisHandlers() {
      document.querySelectorAll('[data-vis-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.visTab;
          document.querySelectorAll('[data-vis-tab]').forEach(b =>
            b.classList.toggle('active', b.dataset.visTab === idx));
          document.querySelectorAll('[data-vis-body]').forEach(b =>
            b.style.display = b.dataset.visBody === idx ? '' : 'none');
        });
      });
      // Inline playback — ▶/⏸ steps the slider on a setInterval at
      // the user-chosen fps. Timer ids are kept in a module-level Map
      // keyed by the vis-pane index, NOT on the button DOM element:
      // renderStagePane reassigns ``pane.innerHTML`` which destroys
      // the old button object, so a timer reference attached to that
      // button would be unreachable. The Map outlives DOM rebuilds
      // so a stale timer can always be cleared.
      window._visPlayTimers = window._visPlayTimers || new Map();
      // Per-vis-pane epoch. Each play() bumps the epoch; pending
      // ``cached.onload`` swaps capture the epoch they were issued
      // under and bail out if a newer epoch is current. Without this
      // the prefetch onload callbacks queued just before stopPlay()
      // keep advancing the visible image for ~_PREFETCH_WINDOW frames
      // after the timer is gone (looks like "pause has no effect").
      window._visPlayEpoch = window._visPlayEpoch || new Map();
      function _btnByIdx(idx) {
        return document.querySelector(`[data-vis-play="${idx}"]`);
      }
      function _currentEpoch(idx) {
        return window._visPlayEpoch.get(String(idx)) || 0;
      }
      function _bumpEpoch(idx) {
        const k = String(idx);
        const next = (_currentEpoch(k) + 1) >>> 0;
        window._visPlayEpoch.set(k, next);
        return next;
      }
      function stopPlay(idx) {
        const t = window._visPlayTimers.get(String(idx));
        if (t) clearInterval(t);
        window._visPlayTimers.delete(String(idx));
        // Invalidate any in-flight prefetch onload swaps from the
        // previous play epoch.
        _bumpEpoch(idx);
        const btn = _btnByIdx(idx);
        if (btn) btn.textContent = '▶';
      }
      window._stopAllVisPlay = () => {
        for (const idx of Array.from(window._visPlayTimers.keys())) {
          stopPlay(idx);
        }
      };
      // Direct slider→image updater. The frame jpgs are 4K (~1.3 MB
      // each), so we keep a small ahead-of-time prefetch buffer to
      // hide network latency during playback. We also wait for each
      // image to actually decode before swapping the visible <img>'s
      // src — that prevents the "blink to white then load" you see
      // when assigning .src on a still-downloading image.
      const _prefetchCache = new Map();   // url → HTMLImageElement (decoded)
      const _PREFETCH_WINDOW = 8;
      function _resForIdx(idx) {
        const sel = document.querySelector(`[data-vis-res="${idx}"]`);
        return (sel?.value || '').trim();
      }
      function _frameUrl(vd, valueIdx, idx) {
        const f = vd.frames[valueIdx];
        const pad = vd.digits || 5;
        const ext = vd.ext || '.jpg';
        const sample = String(f).padStart(pad, '0');
        const base = `/runs_static/${encodeURIComponent(activeRun)}/${vd.url_prefix}/frame_${sample}${ext}`;
        const w = (idx !== undefined) ? _resForIdx(idx) : '';
        // ``activeRun`` is constant per session, but frame jpgs may
        // be re-rendered while the page stays open (e.g. when the
        // user pokes the pipeline). Append a short page-load tag so
        // the browser cache treats post-reload requests as fresh.
        // Server-side resize cache stays sane (it keys on mtime_ns).
        const cacheBust = window._pageLoadTag ||
          (window._pageLoadTag = String(Date.now()));
        const sep = w ? `?w=${w}&_=${cacheBust}` : `?_=${cacheBust}`;
        return base + sep;
      }
      function _prefetch(url) {
        if (_prefetchCache.has(url)) return _prefetchCache.get(url);
        const img = new Image();
        img.src = url;
        _prefetchCache.set(url, img);
        // Bound the cache so long playback doesn't leak memory.
        if (_prefetchCache.size > 64) {
          const oldest = _prefetchCache.keys().next().value;
          _prefetchCache.delete(oldest);
        }
        return img;
      }
      function updateVisFrame(idx, valueIdx) {
        const vd = currentManifest?.vis_dirs?.[parseInt(idx)];
        if (!vd) return;
        const url = _frameUrl(vd, valueIdx, idx);
        const img = document.querySelector(`[data-vis-img="${idx}"]`);
        const lab = document.querySelector(`[data-vis-label="${idx}"]`);
        if (lab) {
          lab.textContent = `frame ${vd.frames[valueIdx]}  (${valueIdx + 1}/${vd.frames.length})`;
        }
        if (!img) return;
        // If already decoded, swap immediately. Otherwise kick off
        // the load and only swap when complete (visible image stays
        // on the previous frame in the meantime — no blinking).
        // Capture the current play epoch so a stop request between
        // request-issue and onload-fire can short-circuit the swap.
        const epoch = _currentEpoch(idx);
        const cached = _prefetch(url);
        if (cached.complete && cached.naturalWidth > 0) {
          img.src = url;
        } else {
          cached.onload = () => {
            if (_currentEpoch(idx) !== epoch) return;
            img.src = url;
          };
        }
        // Prefetch the next N frames at the same resolution.
        for (let k = 1; k <= _PREFETCH_WINDOW; k++) {
          const next = (valueIdx + k) % vd.frames.length;
          _prefetch(_frameUrl(vd, next, idx));
        }
      }

      document.querySelectorAll('[data-vis-play]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.visPlay;
          if (window._visPlayTimers.has(String(idx))) {
            stopPlay(idx);
            return;
          }
          const sl = document.querySelector(`[data-vis-slider="${idx}"]`);
          const fpsSel = document.querySelector(`[data-vis-fps="${idx}"]`);
          if (!sl) return;
          const fps = parseInt(fpsSel?.value || '10', 10);
          btn.textContent = '⏸';
          const interval = Math.max(33, Math.round(1000 / fps));
          const t = setInterval(() => {
            const max = parseInt(sl.max, 10);
            let v = parseInt(sl.value, 10);
            v = (v + 1) > max ? 0 : v + 1;
            sl.value = String(v);
            updateVisFrame(idx, v);
          }, interval);
          window._visPlayTimers.set(String(idx), t);
        });
      });
      // Changing resolution: clear prefetch cache and refresh
      // current frame at the new resolution. Cache is keyed on full
      // URL (including ?w=), so old entries become naturally stale —
      // dropping them keeps memory bounded.
      document.querySelectorAll('[data-vis-res]').forEach((sel) => {
        sel.addEventListener('change', () => {
          const idx = sel.dataset.visRes;
          _prefetchCache.clear();
          const sl = document.querySelector(`[data-vis-slider="${idx}"]`);
          if (sl) updateVisFrame(idx, parseInt(sl.value, 10));
        });
      });
      // Changing fps mid-play: restart with new interval.
      document.querySelectorAll('[data-vis-fps]').forEach((sel) => {
        sel.addEventListener('change', () => {
          const idx = sel.dataset.visFps;
          if (!window._visPlayTimers.has(String(idx))) return;
          stopPlay(idx);
          const btn = _btnByIdx(idx);
          if (btn) btn.click();
        });
      });
      document.querySelectorAll('[data-vis-slider]').forEach((sl) => {
        sl.addEventListener('input', (e) => {
          const idx = sl.dataset.visSlider;
          const vd = currentManifest?.vis_dirs?.[parseInt(idx)];
          if (!vd) return;
          const i = parseInt(sl.value, 10);
          const f = vd.frames[i];
          const pad = vd.digits || 5;
          const ext = vd.ext || '.jpg';
          const sample = String(f).padStart(pad, '0');
          const url = `/runs_static/${encodeURIComponent(activeRun)}/${vd.url_prefix}/frame_${sample}${ext}`;
          const imgEl = document.querySelector(`[data-vis-img="${idx}"]`);
          imgEl.src = url;
          document.querySelector(`[data-vis-label="${idx}"]`).textContent =
            `frame ${f}  (${i + 1}/${vd.frames.length})`;
          // Re-fetch the JSON sidecar + redraw overlay for the
          // consolidation pane. The redraw inside maybeUpdateOverlay
          // would otherwise race against the new img's load: the
          // ResizeObserver / load handler above is the one that
          // settles the final overlay box.
          maybeUpdateOverlay(idx, vd, f);
        });
      });
      // "Clear selection" button: wipes the toggle Set + redraws every
      // overlay + unchecks every visible player checkbox.
      document.querySelectorAll('[data-vis-overlay-clear]').forEach((btn) => {
        btn.addEventListener('click', () => {
          _selectedPlayers.clear();
          document.querySelectorAll('[data-pid-toggle]:checked').forEach((cb) =>
            cb.checked = false);
          redrawAllOverlays();
        });
      });
      // Initial overlay draw for the first frame of any overlay pane.
      // SVG viewBox handles scaling on its own — no need to listen to
      // image load / window resize / ResizeObserver.
      document.querySelectorAll('[data-vis-svg]').forEach((sv) => {
        const idx = sv.dataset.visSvg;
        const vd = currentManifest?.vis_dirs?.[parseInt(idx)];
        if (vd && vd.frames.length) maybeUpdateOverlay(idx, vd, vd.frames[0]);
      });
      // Click-to-zoom on the consolidation pane.
      document.querySelectorAll('[data-vis-wrap]').forEach((wrap) => {
        const idx = wrap.dataset.visWrap;
        const vd = currentManifest?.vis_dirs?.[parseInt(idx)];
        if (!vd || !vd.url_prefix.startsWith('track_consolidation/frames')) return;
        wrap.addEventListener('click', () => {
          const img = wrap.querySelector('img');
          if (img && img.src) openZoomModal(img.src, idx);
        });
      });
    }

    // ---- Consolidation per-frame JSON sidecar + SVG overlay ----
    // Cache one sidecar per (vis_idx, frame) so flipping the overlay
    // mode/pid doesn't re-fetch.
    const _overlayCache = new Map();         // key: idx|frame → json
    const _overlayState = new Map();         // idx → {frame, json}
    // Player_ids currently checked in the Player Tracks card. Empty →
    // nothing drawn on the overlay. Mutated by the checkboxes; every
    // visible SVG overlay redraws when it changes.
    const _selectedPlayers = new Set();
    function redrawAllOverlays() {
      document.querySelectorAll('[data-vis-svg]').forEach((sv) =>
        redrawOverlay(sv.dataset.visSvg));
    }

    async function maybeUpdateOverlay(idx, vd, frame) {
      const svg = document.querySelector(`[data-vis-svg="${idx}"]`);
      if (!svg) return;
      const pad = vd.digits || 5;
      const sample = String(frame).padStart(pad, '0');
      const url = `/runs_static/${encodeURIComponent(activeRun)}/${vd.url_prefix}/frame_${sample}.json`;
      const cacheKey = `${idx}|${frame}`;
      let json = _overlayCache.get(cacheKey);
      if (!json) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`status ${resp.status}`);
          json = await resp.json();
          _overlayCache.set(cacheKey, json);
        } catch (e) {
          // No sidecar — clear the overlay and bail.
          svg.innerHTML = '';
          return;
        }
      }
      _overlayState.set(idx, {frame, json});
      redrawOverlay(idx);
    }

    function redrawOverlay(idx) {
      const svg = document.querySelector(`[data-vis-svg="${idx}"]`);
      const state = _overlayState.get(String(idx)) || _overlayState.get(idx);
      const img = document.querySelector(`[data-vis-img="${idx}"]`);
      if (!svg || !state || !img) return;
      // SVG with viewBox handles all the scaling. preserveAspectRatio
      // "none" lets the overlay follow whatever aspect the browser
      // actually rendered the img at — so the bbox stays glued to the
      // pixel coords inside the img no matter what CSS / dpr does.
      const srcW = state.json.video_w || img.naturalWidth || 1920;
      const srcH = state.json.video_h || img.naturalHeight || 1080;
      svg.setAttribute('viewBox', `0 0 ${srcW} ${srcH}`);
      svg.innerHTML = '';
      if (_selectedPlayers.size === 0) return;     // nothing toggled → empty
      const fontPx = Math.round(srcH / 36);
      const NS = 'http://www.w3.org/2000/svg';
      for (const t of state.json.tracks) {
        if (!_selectedPlayers.has(t.player_id)) continue;
        const [x1, y1, x2, y2] = t.bbox;
        const c = t.color_bgr || [0, 200, 255];
        const color = `rgb(${c[2]}, ${c[1]}, ${c[0]})`;
        const stroke = Math.max(1, Math.round(srcH / 280));
        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', x1);
        rect.setAttribute('y', y1);
        rect.setAttribute('width', x2 - x1);
        rect.setAttribute('height', y2 - y1);
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', color);
        rect.setAttribute('stroke-width', stroke);
        svg.appendChild(rect);
        const jersey = t.jersey_number != null ? `#${t.jersey_number}` : '';
        const label = `${t.player_id} ${jersey}`.trim();
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', x1 + 4);
        text.setAttribute('y', y1 - 6);
        text.setAttribute('font-family', 'sans-serif');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('font-size', fontPx);
        text.setAttribute('fill', '#fff');
        text.setAttribute('paint-order', 'stroke');
        text.setAttribute('stroke', color);
        text.setAttribute('stroke-width', Math.max(3, stroke * 2));
        text.setAttribute('stroke-linejoin', 'round');
        text.textContent = label;
        svg.appendChild(text);
      }
    }

    function openZoomModal(imgUrl, idx) {
      let modal = document.getElementById('vis-zoom-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'vis-zoom-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
        modal.innerHTML = '<img style="max-width:98vw;max-height:96vh;display:block">';
        modal.addEventListener('click', () => modal.style.display = 'none');
        document.body.appendChild(modal);
      }
      // Bump the resolution to whatever the user picked (or original).
      const resSel = document.querySelector(`[data-vis-res="${idx}"]`);
      const res = resSel?.value || '';
      const baseUrl = imgUrl.split('?')[0];
      const zoomUrl = res ? `${baseUrl}?w=${res}` : baseUrl;
      modal.querySelector('img').src = zoomUrl;
      modal.style.display = 'flex';
    }

    let currentManifest = null;
    const _origRender = renderStagePane;
    renderStagePane = function (mf) { currentManifest = mf; _origRender(mf); };

    function renderEventList(mf) {
      const events = mf.stats?._events;
      if (!Array.isArray(events) || !events.length) return '';
      return `<div class="stats-card">
        <h3>Events (${events.length}${events.length === 200 ? '+' : ''})</h3>
        <div class="events-list">
          ${events.map(e => `
            <div class="ev">
              <span class="t">f ${e.frame ?? '?'}</span>
              <span class="ty">${escapeHTML(e.event_type ?? e.type ?? '?')}</span>
              <span class="meta">tid=${e.player_id ?? '-'} team=${e.team_id ?? '-'}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }

    // Scene description + team exemplars — what the LLM saw before
    // looking at each track. Only renders for track_consolidation when
    // llm_inputs/per_track.json was dumped.
    function renderLLMScene(mf) {
      const li = mf.stats?._llm_inputs;
      if (!li) return '';
      const scene = li.scene || {};
      const sceneRows = Object.entries(scene)
        .filter(([k]) => !k.endsWith('_ref_ids'))
        .map(([k, v]) => `
          <div class="kv">
            <div class="k">${escapeHTML(k)}</div>
            <div class="v">${escapeHTML(typeof v === 'string' ? v : JSON.stringify(v))}</div>
          </div>`).join('');
      const exA = li.team_exemplar_urls?.team_A || [];
      const exB = li.team_exemplar_urls?.team_B || [];
      const exemplarRow = (label, urls) => urls.length ? `
        <div style="margin-top:10px">
          <div style="font-size:11px;color:#cfe3ff;margin-bottom:4px;
                      font-family:ui-monospace,'SF Mono',monospace">
            ${escapeHTML(label)} <span style="color:#6b7380">(${urls.length})</span>
          </div>
          <div class="thumb-grid">
            ${urls.map(u => `
              <div>
                <img src="/runs_static/${encodeURIComponent(activeRun)}/${u}"
                     alt="${escapeHTML(label)}" loading="lazy">
              </div>`).join('')}
          </div>
        </div>` : '';
      return `<div class="stats-card">
        <h3>LLM scene context (${li.n_tracks ?? '?'} tracks scored)</h3>
        ${sceneRows ? `<div class="stats-grid">${sceneRows}</div>` : ''}
        ${exemplarRow('team_A exemplars', exA)}
        ${exemplarRow('team_B exemplars', exB)}
      </div>`;
    }

    function renderThumbsGrid(mf) {
      const thumbs = mf.stats?._track_thumbs;
      if (!Array.isArray(thumbs) || !thumbs.length) return '';
      const llm = mf.stats?._llm_inputs?.tracks || {};

      // First-pass: bucket thumbs by orig tid (parsed from filename).
      const byOrig = new Map();   // origTid (str, no leading zeros) → [thumbs]
      for (const t of thumbs) {
        const m = /^track_0*(\d+)_/.exec(t.name);
        const orig = m ? m[1] : t.name;
        if (!byOrig.has(orig)) byOrig.set(orig, []);
        byOrig.get(orig).push(t);
      }
      // Second-pass: bucket orig tids by consolidated player using
      // player_map.json. Orig tids that aren't in the map (dropped /
      // off-field tracks) land in an "unmapped" bucket.
      const playerMap = mf.stats?._player_map || {};
      const byPlayer = new Map();  // playerId → Map(origTid → [thumbs])
      for (const [orig, items] of byOrig.entries()) {
        const player = playerMap[orig] ?? '(unmapped)';
        if (!byPlayer.has(player)) byPlayer.set(player, new Map());
        byPlayer.get(player).set(orig, items);
      }
      // Sort players alphabetically; "(unmapped)" sinks to the end.
      const playerList = [...byPlayer.entries()].sort(([a], [b]) => {
        if (a === '(unmapped)') return 1;
        if (b === '(unmapped)') return -1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      const numTracks = byOrig.size;
      const numPlayers = byPlayer.size;

      // ---- Frame-coverage timelines ----
      // Player-level coverage comes from track_consolidation/tracks.json
      // (built server-side as _track_lifetimes when running for the
      // consolidation stage). Per-orig-tid coverage comes from tracking
      // stage's own lifetimes payload, but for the consolidation page
      // we recompute it locally from the consolidator's tracks.json so
      // both timelines share an axis. As a fallback, we read whatever
      // ``_orig_track_lifetimes`` the server happens to ship (added
      // below) so the inner sparkline shows the same data as tracking.
      const playerLifetimes = mf.stats?._track_lifetimes || {};
      const origLifetimes = mf.stats?._orig_track_lifetimes || {};
      // Global axis spans the union of every visible track's frames so
      // every sparkline shares the same x scale. If nothing has
      // lifetimes, fall back to [0, 1] so the layout still draws.
      let minF = Infinity, maxF = -Infinity;
      for (const v of Object.values(playerLifetimes)) {
        if (v.first_frame < minF) minF = v.first_frame;
        if (v.last_frame  > maxF) maxF = v.last_frame;
      }
      for (const v of Object.values(origLifetimes)) {
        if (v.first_frame < minF) minF = v.first_frame;
        if (v.last_frame  > maxF) maxF = v.last_frame;
      }
      if (!isFinite(minF)) { minF = 0; maxF = 1; }
      const sparkSpan = Math.max(1, maxF - minF);
      function spark(frames, w = 220, h = 14) {
        if (!frames || frames.length === 0) {
          return `<svg width="${w}" height="${h}"
                       style="background:#0d1116;border-radius:2px;display:block"></svg>`;
        }
        const lifeStart = frames[0], lifeEnd = frames[frames.length - 1];
        const sx = (f) => Math.round(((f - minF) / sparkSpan) * (w - 2)) + 1;
        const lx = sx(lifeStart);
        const lw = Math.max(2, sx(lifeEnd) - lx);
        const ticks = frames
          .map(f => `<line x1="${sx(f)}" y1="2" x2="${sx(f)}" y2="${h-2}" stroke="#3b82f6" stroke-width="1"/>`)
          .join('');
        return `<svg width="${w}" height="${h}"
                     style="background:#0d1116;border-radius:2px;display:block;cursor:pointer"
                     data-tid-frames='${JSON.stringify(frames)}'
                     data-min-frame="${minF}"
                     data-max-frame="${maxF}"
                     title="click to jump to nearest frame">
          <rect x="${lx}" y="${h/2-1}" width="${lw}" height="2" fill="#1e3a5f"/>
          ${ticks}
        </svg>`;
      }
      // Build a player-level sparkline by unioning all member orig
      // tids' frame lists (covers cases where only the per-orig
      // lifetimes are available).
      function playerSpark(pid, origs) {
        const direct = playerLifetimes[pid];
        if (direct) return spark(direct.frames);
        // Fallback: merge orig frame lists.
        const merged = new Set();
        for (const orig of origs) {
          const lt = origLifetimes[orig];
          if (lt) for (const f of lt.frames) merged.add(f);
        }
        const out = [...merged].sort((a, b) => a - b);
        return spark(out);
      }
      function playerCoverage(pid, origs) {
        const direct = playerLifetimes[pid];
        if (direct) return direct.n_frames;
        let total = 0;
        for (const orig of origs) {
          const lt = origLifetimes[orig];
          if (lt) total += lt.n_frames;
        }
        return total;
      }

      return `<div class="stats-card">
        <h3>Player tracks (${numPlayers} players · ${numTracks} orig tracks · ${thumbs.length} thumbs)</h3>
        <div style="font-size:11px;color:#9aa3ad;margin-bottom:8px">
          Outer rows are consolidated players with their merged frame coverage. Expand a row to see each contributing orig track — its own coverage sparkline plus the crops the jersey LLM saw.
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          ${playerList.map(([player, origMap]) => {
            const origs = [...origMap.entries()].sort(
              ([a], [b]) => parseInt(a, 10) - parseInt(b, 10));
            const origIds = origs.map(([o]) => o);
            const totalThumbs = origs.reduce((s, [, v]) => s + v.length, 0);
            const cov = playerCoverage(player, origIds);
            const sparkSvg = playerSpark(player, origIds);
            const safePid = escapeHTML(player);
            return `<details open class="player-block">
              <summary style="cursor:pointer;list-style:none;display:flex;
                              align-items:center;gap:10px;padding-bottom:4px;
                              border-bottom:1px solid #2a323c;font-weight:600;
                              color:#fff">
                <span class="caret" style="display:inline-block;width:10px;
                                            color:#6b7380;transition:transform 0.1s">▼</span>
                <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer"
                       onclick="event.stopPropagation()"
                       title="Show this player's bbox on the frame above">
                  <input type="checkbox" data-pid-toggle="${safePid}">
                </label>
                ${safePid}
                <span style="color:#9aa3ad;font-weight:400;font-size:11px">
                  ${origs.length} orig track${origs.length > 1 ? 's' : ''} · ${cov} frames
                </span>
                <span style="margin-left:auto">${sparkSvg}</span>
              </summary>
              <div style="padding-top:6px">
                ${origs.map(([orig, items]) => {
                  const rec = llm[orig];
                  const isBatched = Array.isArray(rec?.batches) && rec.batches.length > 0;
                  const body = isBatched
                    ? renderBatchedTrackBody(orig, rec, items)
                    : renderLegacyTrackBody(orig, rec, items);
                  const origLt = origLifetimes[orig];
                  const origSpark = origLt ? spark(origLt.frames, 180, 12) : '';
                  const origCov = origLt ? `${origLt.n_frames} frames` : `${items.length} crops`;
                  return `
                  <details class="orig-block" style="margin:4px 0 4px 4px">
                    <summary style="font-size:11px;color:#cfe3ff;cursor:pointer;
                                    padding:4px 6px;border-radius:4px;
                                    font-family:ui-monospace,'SF Mono',monospace;
                                    list-style:none;display:flex;align-items:center;gap:6px"
                             data-orig="${escapeHTML(orig)}">
                      <span class="caret" style="display:inline-block;width:10px;
                                                  color:#6b7380;transition:transform 0.1s">▶</span>
                      orig ${escapeHTML(orig)}
                      <span style="color:#6b7380">(${escapeHTML(origCov)} · ${items.length} crops${isBatched ? ' · ' + rec.batches.length + ' batches' : ''})</span>
                      ${origSpark ? `<span style="margin-left:8px">${origSpark}</span>` : ''}
                      ${renderLLMVerdictInline(rec)}
                    </summary>
                    <div style="padding:6px 0 0 14px">
                      ${renderLLMVerdict(rec)}
                      ${body}
                    </div>
                  </details>`;
                }).join('')}
              </div>
            </details>`;
          }).join('')}
        </div>
      </div>`;
    }

    // Single-line condensed verdict shown inside the collapsed
    // <summary> so the user can see jersey/team/conf without
    // expanding. Returns '' when the record is missing.
    function renderLLMVerdictInline(rec) {
      if (!rec) return '';
      const v = rec.vote || {};
      const jersey = v.jersey_number != null ? `#${v.jersey_number}` : '#?';
      const conf = typeof v.confidence === 'number' ? v.confidence.toFixed(2) : '—';
      const team = v.team || '—';
      const role = v.role || '—';
      return `<span style="margin-left:auto;color:#9aa3ad;font-weight:400">
        ${escapeHTML(jersey)}  ·  ${escapeHTML(team)}  ·  ${escapeHTML(role)}  ·  conf ${conf}
      </span>`;
    }

    function renderLLMVerdict(rec) {
      if (!rec) return '';
      const v = rec.vote || {};
      const jersey = v.jersey_number != null ? `#${v.jersey_number}` : '—';
      const conf = typeof v.confidence === 'number' ? v.confidence.toFixed(2) : '—';
      const team = v.team || '—';
      const role = v.role || '—';
      const reason = v.reasoning || '';
      const pos = rec.position_label || '—';
      const mov = rec.movement_description || '';
      return `<div style="background:#0d1116;border:1px solid #2a323c;
                          border-radius:5px;padding:6px 8px;margin-bottom:6px;
                          font-size:11px;line-height:1.4">
        <div style="display:flex;gap:10px;flex-wrap:wrap;color:#cfe3ff;font-weight:600">
          <span>jersey ${jersey}</span>
          <span style="color:#9aa3ad">·</span>
          <span>conf ${conf}</span>
          <span style="color:#9aa3ad">·</span>
          <span>team ${escapeHTML(team)}</span>
          <span style="color:#9aa3ad">·</span>
          <span>role ${escapeHTML(role)}</span>
          <span style="color:#9aa3ad">·</span>
          <span>pos ${escapeHTML(pos)}</span>
          <span style="color:#9aa3ad">·</span>
          <span>${rec.n_crops_to_llm ?? 0} crops</span>
        </div>
        ${reason ? `<div style="color:#9aa3ad;margin-top:3px">↳ ${escapeHTML(reason)}</div>` : ''}
        ${mov ? `<div style="color:#6b7380;margin-top:2px;font-style:italic">${escapeHTML(mov)}</div>` : ''}
      </div>`;
    }

    // Lightbox helper — one shared overlay element that pops a
    // full-size image when the user clicks any thumb / montage. Lazy
    // creates the DOM on first use; ``Esc`` or click anywhere
    // dismisses it.
    function showLightbox(url) {
      let lb = document.getElementById('lightbox-overlay');
      if (!lb) {
        lb = document.createElement('div');
        lb.id = 'lightbox-overlay';
        lb.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.85);
                             display:none;align-items:center;justify-content:center;
                             z-index:10000;cursor:zoom-out;padding:20px`;
        const img = document.createElement('img');
        img.id = 'lightbox-img';
        img.style.cssText = `max-width:100%;max-height:100%;object-fit:contain;
                              border:1px solid #2a323c;border-radius:4px`;
        lb.appendChild(img);
        lb.addEventListener('click', () => { lb.style.display = 'none'; });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') lb.style.display = 'none';
        });
        document.body.appendChild(lb);
      }
      const img = document.getElementById('lightbox-img');
      img.src = url;
      lb.style.display = 'flex';
    }
    window.showLightbox = showLightbox;

    // Render a track in the new "batched OCR" format:
    //   - one collapsible <details> per LLM batch
    //   - summary shows batch index, crop count, LLM read + confidence
    //   - body shows the montage image (click to enlarge) + the
    //     individual source crops that went into it
    // No top-level thumb grid — the per-batch view IS the per-crop
    // view, organised by what the LLM actually saw together.
    function renderBatchedTrackBody(orig, rec, items) {
      const batches = rec?.batches || [];
      // Build a name → item lookup once so each batch can pull just
      // its source crops cheaply.
      const itemByName = new Map();
      for (const it of items) itemByName.set(it.name, it);
      const cropMeta = rec?.crops || [];
      const cropByIdx = (idx) => {
        const meta = cropMeta[idx];
        if (!meta) return null;
        return {
          ...meta,
          item: itemByName.get(meta.name),
        };
      };
      const blocks = batches.map((b, bi) => {
        const reading = b.ocr_reading;
        const cc = b.ocr_confidence;
        const visible = b.ocr_visible || '';
        const idxs = b.crop_indices || [];
        const montageUrl = `/runs_static/${encodeURIComponent(activeRun)}/track_consolidation/llm_inputs/montages/${b.name}`;

        let summaryLabel;
        if (reading != null) {
          summaryLabel = `<span style="color:#cfe3ff;font-weight:600">#${reading}</span>
            <span style="color:#9aa3ad">· conf ${cc?.toFixed(2)}</span>`;
        } else {
          summaryLabel = `<span style="color:#9aa3ad">no read</span>`;
        }

        // Source crops fed into this montage, in row-major order.
        const sourceCrops = idxs.map(i => {
          const meta = cropByIdx(i);
          if (!meta || !meta.item) return '';
          const it = meta.item;
          const m = /_f0*(\d+)\.[a-z]+$/i.exec(it.name);
          const frame = m ? parseInt(m[1], 10) : null;
          const dataAttr = frame !== null ? ` data-frame="${frame}"` : '';
          const cls = frame !== null ? ' thumb-jump' : '';
          const title = frame !== null ? ` title="jump to frame ${frame}"` : '';
          return `<div>
            <img src="/runs_static/${encodeURIComponent(activeRun)}/${it.url}"
                 alt="${escapeHTML(it.name)}" loading="lazy"
                 class="thumb-img${cls}"${dataAttr}${title}>
            <div class="thumb-label">${escapeHTML(it.name.replace(/^track_\d+_/, ''))}</div>
          </div>`;
        }).join('');

        return `<details class="batch-block" style="margin:4px 0;
                                                    border:1px solid #2a323c;
                                                    border-radius:4px;
                                                    background:#0d1116">
          <summary style="font-size:11px;color:#cfe3ff;cursor:pointer;
                          padding:6px 8px;list-style:none;
                          display:flex;align-items:center;gap:8px;
                          font-family:ui-monospace,'SF Mono',monospace">
            <span class="caret" style="display:inline-block;width:10px;
                                       color:#6b7380">▶</span>
            <span>batch ${bi}</span>
            <span style="color:#6b7380">· ${idxs.length} crops</span>
            <span style="margin-left:auto">${summaryLabel}</span>
          </summary>
          <div style="padding:8px;display:grid;grid-template-columns:auto 1fr;gap:12px">
            <div>
              <img src="${montageUrl}" loading="lazy"
                   onclick="window.showLightbox('${montageUrl}')"
                   alt="${escapeHTML(b.name)}"
                   style="height:240px;border:1px solid #1f2730;border-radius:3px;
                          cursor:zoom-in;display:block">
              <div style="font-size:10px;color:#6b7380;margin-top:4px;text-align:center">
                click to enlarge
              </div>
            </div>
            <div>
              <div style="font-size:11px;color:#9aa3ad;margin-bottom:4px">
                LLM verdict — ${summaryLabel}
              </div>
              ${visible ? `<div style="font-size:11px;color:#cfe3ff;
                                        background:#161c24;padding:4px 6px;
                                        border-radius:3px;margin-bottom:8px">
                ↳ ${escapeHTML(visible)}
              </div>` : ''}
              <div style="font-size:10px;color:#6b7380;margin-bottom:4px">
                source crops fed to montage (${idxs.length}):
              </div>
              <div class="thumb-grid">${sourceCrops}</div>
            </div>
          </div>
        </details>`;
      }).join('');
      return blocks || '<div style="color:#6b7380;font-size:11px">no batches</div>';
    }

    // Legacy per-crop renderer — kept for runs that pre-date the
    // batched OCR change. Identical to the original thumb-grid +
    // per-crop OCR label layout.
    function renderLegacyTrackBody(orig, rec, items) {
      const llmCrops = rec?.crops || [];
      const cropMap = new Map(llmCrops.map(c => [c.name, c]));
      const thumbs = items.map(t => {
        const m = /_f0*(\d+)\.[a-z]+$/i.exec(t.name);
        const frame = m ? parseInt(m[1], 10) : null;
        const dataAttr = frame !== null ? ` data-frame="${frame}"` : '';
        const cls = frame !== null ? ' thumb-jump' : '';
        const title = frame !== null ? ` title="jump to frame ${frame}"` : '';
        const crop = cropMap.get(t.name);
        let ocrLabel = '';
        if (crop) {
          const reading = crop.ocr_reading;
          const cc = crop.ocr_confidence;
          const visible = crop.ocr_visible || '';
          if (reading != null) {
            ocrLabel = `<div class="thumb-ocr ocr-hit"
              title="${escapeHTML(visible)}">
              #${reading}<span style="color:#9aa3ad">·${cc?.toFixed(2)}</span>
            </div>`;
          } else if (visible) {
            ocrLabel = `<div class="thumb-ocr ocr-miss"
              title="${escapeHTML(visible)}">
              ${escapeHTML(visible.length > 14
                ? visible.slice(0,14) + '…' : visible)}
            </div>`;
          }
        }
        return `<div>
          <img src="/runs_static/${encodeURIComponent(activeRun)}/${t.url}"
               alt="${escapeHTML(t.name)}" loading="lazy"
               class="thumb-img${cls}"${dataAttr}${title}>
          <div class="thumb-label">${escapeHTML(t.name.replace(/^track_\d+_/, ''))}</div>
          ${ocrLabel}
        </div>`;
      }).join('');
      return `<div class="thumb-grid">${thumbs}</div>`;
    }

    function fmtSize(n) {
      if (!n) return '—';
      if (n < 1024) return n + ' B';
      if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
      if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
      return (n/1024/1024/1024).toFixed(2) + ' GB';
    }

    // Per-orig-track lifetime listing for the tracking stage. For each
    // raw tracker tid: first / last / n_frames + (collapsible) full
    // frame list, plus the consolidated player_id when player_map is
    // present.
    function renderTrackLifetimes(mf) {
      const lt = mf.stats?._track_lifetimes;
      if (!lt) return '';
      // On the consolidation stage the per-player coverage is rendered
      // inside the merged "Player tracks" card (renderThumbsGrid) so the
      // user can drill into each orig track + see crops + LLM verdict
      // in the same place. Don't emit the standalone table here.
      if (mf.stage === 'track_consolidation') return '';
      const playerMap = mf.stats?._player_map || {};
      const rows = Object.values(lt);
      // tids may be ints (tracking) or strings (consolidation player_ids
      // like "B-7"). Sort by first_frame, then by tid stringified.
      rows.sort((a, b) => a.first_frame - b.first_frame
        || String(a.tid).localeCompare(String(b.tid), undefined, {numeric: true}));
      const isConsolidation = (mf.stage === 'track_consolidation');
      const minFrame = rows.length ? Math.min(...rows.map(r => r.first_frame)) : 0;
      const maxFrame = rows.length ? Math.max(...rows.map(r => r.last_frame)) : 1;
      const span = Math.max(1, maxFrame - minFrame);
      // Build a one-line sparkline DOM piece per tid: tiny SVG rect
      // showing where this tid's frames fall on the global timeline.
      function sparkline(tid, frames) {
        const w = 160, h = 12;
        const lifeStart = frames[0], lifeEnd = frames[frames.length - 1];
        const sx = (f) => Math.round(((f - minFrame) / span) * (w - 2)) + 1;
        const lx = sx(lifeStart);
        const lw = Math.max(2, sx(lifeEnd) - lx);
        const ticks = frames
          .map(f => `<line x1="${sx(f)}" y1="2" x2="${sx(f)}" y2="${h-2}" stroke="#3b82f6" stroke-width="1"/>`)
          .join('');
        return `<svg width="${w}" height="${h}"
                     style="background:#0d1116;border-radius:2px;display:block;cursor:pointer"
                     data-tid-frames='${JSON.stringify(frames)}'
                     data-min-frame="${minFrame}"
                     data-max-frame="${maxFrame}"
                     title="click to jump to nearest frame">
          <rect x="${lx}" y="${h/2-1}" width="${lw}" height="2" fill="#1e3a5f"/>
          ${ticks}
        </svg>`;
      }
      function fmtFrameChips(frames) {
        // Render every frame as a clickable chip. Lifetime frames are
        // already in order; we don't collapse uniform runs because the
        // user wants to *click* individual frames to scrub.
        return frames.map(f => `
          <span class="frame-chip" data-frame="${f}"
                style="display:inline-block;padding:2px 7px;margin:2px;
                       background:#1e242b;border:1px solid #2a323c;
                       border-radius:3px;color:#cfe3ff;cursor:pointer;
                       font-family:ui-monospace,'SF Mono',monospace;
                       font-size:11px"
                onmouseover="this.style.background='#2a4661'"
                onmouseout="this.style.background='#1e242b'">${f}</span>`).join('');
      }
      const title = isConsolidation
        ? `Player frame coverage (${rows.length} players)`
        : `Orig track lifetimes (${rows.length} tracks)`;
      const subtitle = isConsolidation
        ? "For each consolidated player: when they first/last appear and which sampled frames they show up in. Gaps in the sparkline are the player's missing frames. Click a row to expand the full frame list."
        : "For each raw tracker ID: when it first/last appears and which sampled frames it shows up in. Sparkline is its presence across the whole clip; click a row to expand the full frame list.";
      const idHeader = isConsolidation ? 'player_id' : 'orig tid';
      // Consolidation rows already are player_ids; drop the redundant
      // "consolidated" column there.
      const cols = isConsolidation
        ? [['player_id', 1], ['first', 1], ['last', 1], ['n', 1], ['timeline', 1]]
        : [['orig tid', 1], ['first', 1], ['last', 1], ['n', 1], ['consolidated', 1], ['timeline', 1]];
      const colspan = cols.length;
      return `<div class="stats-card">
        <h3>${title}</h3>
        <div style="font-size:11px;color:#9aa3ad;margin-bottom:8px">${subtitle}</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums">
          <thead>
            <tr style="text-align:left;color:#9aa3ad;border-bottom:1px solid #2a323c">
              ${cols.map(c => `<th style="padding:4px 8px">${c[0]}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => {
              const pid = playerMap[String(r.tid)] ?? '';
              const rowId = `lifetime-row-${i}`;
              const detailId = `lifetime-detail-${i}`;
              const idCell = `<td style="padding:4px 8px;color:#cfe3ff;font-weight:600">${escapeHTML(String(r.tid))}</td>`;
              const consolidatedCell = isConsolidation ? '' :
                `<td style="padding:4px 8px;color:${pid ? '#cfe3ff' : '#6b7380'}">${escapeHTML(pid || '(unmapped)')}</td>`;
              return `
                <tr id="${rowId}" data-detail="${detailId}"
                    style="cursor:pointer;border-bottom:1px solid #1e242b">
                  ${idCell}
                  <td style="padding:4px 8px">${r.first_frame}</td>
                  <td style="padding:4px 8px">${r.last_frame}</td>
                  <td style="padding:4px 8px">${r.n_frames}</td>
                  ${consolidatedCell}
                  <td style="padding:4px 8px">${sparkline(r.tid, r.frames)}</td>
                </tr>
                <tr id="${detailId}" style="display:none;background:#0d1116">
                  <td colspan="${colspan}" style="padding:6px 14px;line-height:1.6">
                    <span style="font-size:11px;color:#9aa3ad;margin-right:6px">click a frame to scrub the vis above:</span>
                    ${fmtFrameChips(r.frames)}
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    }

    // Bind row click handler once at DOM-mutation level (delegated):
    // Delegated change listener for the per-player overlay checkboxes.
    // Survives panel re-renders (Player Tracks card is rebuilt every
    // time renderStagePane runs).
    document.addEventListener('change', (e) => {
      const cb = e.target.closest('[data-pid-toggle]');
      if (!cb) return;
      const pid = cb.dataset.pidToggle;
      if (cb.checked) _selectedPlayers.add(pid);
      else _selectedPlayers.delete(pid);
      redrawAllOverlays();
    });

    document.addEventListener('click', (e) => {
      // Frame chip → scrub the vis above to that frame.
      const chip = e.target.closest('.frame-chip');
      if (chip) {
        e.stopPropagation();  // don't toggle the parent row
        const f = parseInt(chip.dataset.frame, 10);
        if (!Number.isNaN(f)) gotoFrame(f);
        return;
      }
      // Track-thumb image → jump to the frame embedded in its filename.
      const thumb = e.target.closest('.thumb-jump');
      if (thumb) {
        e.preventDefault();
        e.stopPropagation();
        const f = parseInt(thumb.dataset.frame, 10);
        if (!Number.isNaN(f)) gotoFrame(f);
        return;
      }
      // Row click → toggle frame-list expansion.
      const tr = e.target.closest('tr[data-detail]');
      if (!tr) return;
      const det = document.getElementById(tr.dataset.detail);
      if (det) det.style.display = det.style.display === 'none' ? '' : 'none';
    });

    // Switch to the first vis tab (tracking frames) and snap its
    // slider to the closest frame, then dispatch input so the existing
    // slider handler refreshes the JPG + label.
    function gotoFrame(targetFrame) {
      const vis = currentManifest?.vis_dirs;
      if (!Array.isArray(vis) || !vis.length) return;
      // Pick the vis dir whose frames best contain the target. Prefer
      // index 0 (tracking) if it has the frame, else any dir that
      // contains it, else fall back to nearest neighbour in dir 0.
      let chosenIdx = 0;
      let chosenVd = vis[0];
      if (!chosenVd.frames.includes(targetFrame)) {
        for (let i = 0; i < vis.length; i++) {
          if (vis[i].frames.includes(targetFrame)) {
            chosenIdx = i; chosenVd = vis[i]; break;
          }
        }
      }
      // Activate that tab.
      document.querySelectorAll('[data-vis-tab]').forEach(b =>
        b.classList.toggle('active', b.dataset.visTab === String(chosenIdx)));
      document.querySelectorAll('[data-vis-body]').forEach(b =>
        b.style.display = b.dataset.visBody === String(chosenIdx) ? '' : 'none');
      // Find the slider position (frame index in this dir's array).
      const frames = chosenVd.frames;
      let i = frames.indexOf(targetFrame);
      if (i < 0) {
        // Nearest neighbour
        let bestD = Infinity;
        for (let k = 0; k < frames.length; k++) {
          const d = Math.abs(frames[k] - targetFrame);
          if (d < bestD) { bestD = d; i = k; }
        }
      }
