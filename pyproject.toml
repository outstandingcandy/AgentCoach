[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goalinsight"
version = "3.0.0"
requires-python = ">=3.11"

[project.scripts]
goalinsight = "goalinsight.cli:main"
goalinsight-web = "goalinsight.web.__main__:main"

[tool.setuptools.packages.find]
include = ["goalinsight*"]
