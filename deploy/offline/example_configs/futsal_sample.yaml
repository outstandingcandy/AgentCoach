# Futsal sample config — runs end-to-end against the bundled
# example_video.mp4 + annotations/example_video/.
#
# Defaults to local-only inference (no AWS / no Google API keys
# required). The track_consolidation stage is OMITTED from the
# default pipeline because all of its jersey-OCR backends need
# either a cloud API (claude / gemini) or a heavy local VLM
# (qwen vLLM server). To enable it:
#   * uncomment the ``track_consolidation`` line in ``pipeline.stages``,
#   * set ``track_consolidation.jersey.backend: claude``,
#   * pass AWS creds at ``docker run`` time via
#     ``-e AWS_ACCESS_KEY_ID=... -e AWS_SECRET_ACCESS_KEY=... \
#      -e AWS_DEFAULT_REGION=us-east-1``.
# Without it, downstream stages still work but track ids stay as raw
# tracker tids (no stable A-9 / B-GK player names + no jersey numbers).

video:
  process_fps: 30
sample:
  stride: 1
pitch_type: futsal

field_registration:
  backend: fixed_camera
  process_fps: 10
  physical:
    camera_profile: futsal_phone_1080p
    free_intrinsics: true
    focal_hfov_deg_bounds: [70, 90]
    camera_position: [-20.0, -10.0, 5.0]
    position_bounds_m: [8.0, 8.0, 3.0]
    vis_interval: 30

device: cuda

unified_detection:
  imgsz: 0
  iou_threshold: 0.55

reid:
  # CLIP-ReID gives the best player separation on this clip. Weights
  # are pre-baked into the image at /opt/goalinsight/models/clip_reid/
  # by build.sh. Drop to ``backend: osnet`` (no weights_path needed)
  # if you want a faster smoke test.
  backend: clip_reid
  clip_reid:
    backbone: ViT-L-14
    weights_path: /opt/goalinsight/models/clip_reid/ViT-L-14_openai/Paper/weights_e4.pth
    remove_proj: true
    batch_size: 16

tracking:
  reid_pitch_max_m: 0.8
  # Calibrated for clip_reid's tight cosine distribution. If you flip
  # ``reid.backend`` back to osnet/prtreid, change this to 0.2.
  max_cosine_distance: 0.012
  vis_frames_enabled: false
  dump_yolo_raw: false
  dump_ball_diag: false

# track_consolidation defaults (commented out below). Uncomment +
# add an API key env var to enable jersey-aware consolidation.
# track_consolidation:
#   min_track_seconds: 1.0
#   jersey:
#     backend: claude
#     model_id: us.anthropic.claude-sonnet-4-6
#     region: us-east-1
#     ocr_backend: llm
#   frame_stride: 8

pipeline:
  stages:
    - field_registration
    - tracking
    # - track_consolidation     # enable after configuring an API key
    - event_detection
    # player_profile depends on track_consolidation/players.json — enable
    # both together (uncomment track_consolidation above + add API key).
    # - player_profile
