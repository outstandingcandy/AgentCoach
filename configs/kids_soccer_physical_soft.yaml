# Soft-constraint variant of kids_soccer_physical.yaml — used for the
# first run to confirm camera_position direction (sign of Y) before
# enabling lock_camera_position.
video:
  process_fps: 5     # halved to keep first probe run quick

intrinsics:
  fx: 2448.68

pitch:
  pitch_length: 66.28
  pitch_width: 43.15
  penalty_area_width: 21.84
  penalty_area_length: 9.96
  goal_area_width: 11.79
  goal_area_length: 4.13
  goal_line_to_penalty_mark: 8.0
  center_circle_radius: 7.0
  goal_height: 2.15
  goal_length: 4.44

field_registration:
  backend: "physical"

  physical:
    camera_profile: "kids_soccer_1080p"
    ransac_reproj_error: 30.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 15.0
    use_line_model: true
    focal_bounds: [2000.0, 2900.0]
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 5.0

    # SOFT prior — tells the optimizer which solution to prefer when
    # there's geometric ambiguity, but lets pose float to whatever fits
    # the data best. Used to verify the sign of Y before locking.
    camera_position: [0.0, -21.575, 2.0]
    lock_camera_position: false
    position_weight: 50.0

    pitch_length: 66.28
    pitch_width: 43.15

    calibration_skip: 2

  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260531_024941/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
    use_lines: true
    line_model_path: "data/finetuned_line_models/run_20260601_142205/models/best_model.pt"
    line_weights: "SV_lines"
    line_threshold: 0.10

device: "cuda"

pipeline:
  stages:
    - field_registration
