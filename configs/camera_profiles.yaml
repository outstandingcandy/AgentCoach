  # Working profile for the 0626_1_part_000 futsal-corner rig.
  # Calibrated via cv2.calibrateCamera on 14 manual annotations
  # (12 ground-plane + 2 goal-post tops at z!=0) with intrinsics fully
  # free (fy=fx aspect lock + k3=0 to avoid 6th-order over-fit).
  # Result: RMS=8.13 px across all 14 points, solver-recovered camera
  # position (-23.5, -11.4, 5.3) — within 4 m of the field-measured
  # rig position (-20, -10, 5).
  # The notable values:
  #   fx ≈ 946 → HFOV ≈ 91° (wide-angle lens, near-fisheye marketing)
  #   cx=826, cy=620 → principal point offset ~134 px in x, ~80 px in y
  #     (almost certainly because the recorded MP4 was cropped off-centre
  #     from a higher-res capture; raw sensor optical axis is otherwise
  #     near-centred)
  #   k1≈+0.48, k2≈-0.39, p1, p2 small → mild pincushion, fairly typical
  #     for a wide-angle phone/action-cam lens
  # The pipeline picks this profile up via field_registration.physical's
  # ``camera_profile: futsal_phone_1080p`` + ``free_intrinsics: true``
  # (the second flag tells solve_camera_physical to run cv2.calibrateCamera
  # at solve time instead of using PhysicalCalibrator's locked-cx/cy LM).
  # Future videos shot with THIS SAME rig (lens + recording crop) can
  # drop the ``free_intrinsics`` flag and rely on the K + dist here
  # being fixed and physical.
  dji_osmo_action_4_1080p:
    label: "DJI Osmo Action 4 1080p (wide-angle, futsal test rig)"
    image_size: [1920, 1080]
    K:
    - [946.25, 0.0, 825.94]
    - [0.0, 946.25, 619.67]
    - [0.0, 0.0, 1.0]
    dist_coeffs: [0.4783, -0.3896, 0.0328, 0.0671, 0.0000]
    # Lens field-of-view bounds (camera-fixed property). fx=946.25 → HFOV
    # ≈90.8°; this range brackets it so a physical solve can nudge focal
    # a little without drifting off the calibrated value. A per-video
    # focal_hfov_deg_bounds / focal_bounds still overrides this.
    focal_hfov_deg_bounds: [88.0, 94.0]
