# Configuration for physical calibration backend with Veo camera
# Uses fixed camera intrinsics and 6-DOF extrinsic optimization

video:
  process_fps: 5        # Stage 1 calibration fps
  tracking_fps: 10      # Stage 2 tracking fps (interpolates camera poses)

field_registration:
  backend: "physical"

  physical:
    camera_profile: "veo_1080p"
    ransac_reproj_error: 30.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 15.0
    use_line_model: false
    focal_bounds: [400.0, 3500.0]
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 5.0
    camera_position: [0.0, -31.0, 6.6]
    position_weight: 200.0
    pitch_length: 89.7
    pitch_width: 56.5
    calibration_skip: 2              # Calibrate every 2nd frame, interpolate the rest

  pnlcalib:
    # keypoint_weights: "SV_kp"
    keypoint_model_path: "data/finetuned_models/run_20260319_135637/models/best_model.pt"
    # keypoint_model_path: "data/pretrain_models/SV_kp"
    keypoint_threshold: 0.3434
    # keypoint_threshold: 0.15

ball_detection:
  confidence_threshold: 0.15  # Lower threshold; tracker Kalman filter handles false positives
