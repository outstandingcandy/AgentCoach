# clip_000_physical.yaml
# Comments / rationale live in docs/config_notes.md (#clip_000_physical.yaml).

video:
  process_fps: 5
  tracking_fps: 10
field_registration:
  backend: "physical"
  physical:
    camera_profile: "veo_1080p"
    ransac_reproj_error: 30.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 15.0
    use_line_model: false
    focal_hfov_deg_bounds: [30.7, 134.8]
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 5.0
    camera_position: [0.0, -31.0, 6.6]
    position_weight: 200.0
    pitch_length: 89.7
    pitch_width: 56.5
    calibration_skip: 2
  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260319_135637/models/best_model.pt"
    keypoint_threshold: 0.3434
ball_detection:
  confidence_threshold: 0.15
video_enhancement:
  enabled: true
  mode: "docker"
  upscale:
    enabled: true
    processor: "realesrgan"
    scale: 2
  interpolate:
    enabled: false
  encoder:
    codec: "libx264"
    extra:
      crf: "17"
      preset: "slow"
