video:
  process_fps: 30            # 30 fps source = process every video frame (dense
                             # tracking). Smaller per-frame displacements make
                             # IoU/pitch gates much tighter, killing the
                             # "two-same-team-players-close-together" ID
                             # switches. fps-sensitive tracker defaults
                             # (max_age, pitch_gate_m, reid_pitch_max_m) auto-
                             # scale by effective_fps/10, so physical meaning
                             # is preserved.

# Single source of truth for "compute every Nth video frame" used both
# for the per-stage compute path and for the per-frame jpg/json vis
# sink. Keeping these in sync means the vis sample lines up exactly
# with what each stage actually processed — no missing-detection holes.
sample:
  stride: 1                  # process every video frame (matches process_fps=30 on 30fps source)

# Standard FIFA-spec adult pitch (105 × 68 m). Used by the
# physical backend's PnP + the rest of the pipeline (events, highlights,
# pitch labels, etc.). All measurements in metres.
pitch:
  pitch_length: 105.0
  pitch_width: 68.0
  penalty_area_width: 40.32
  penalty_area_length: 16.5
  goal_area_width: 18.32
  goal_area_length: 5.5
  goal_line_to_penalty_mark: 11.0
  center_circle_radius: 9.15
  goal_height: 2.44
  goal_length: 7.32

field_registration:
  backend: "physical"

  # Calibration changes slowly across frames (camera doesn't pan/zoom
  # at 30 fps). Run field_registration at 10 fps to cut wall-clock
  # ~3× without affecting downstream stages — tracking still consumes
  # the full 30 fps stream because video.process_fps stays at 30.
  process_fps: 10

  physical:
    # Generic 4K profile (3500 fx, no distortion) — matches the
    # 3840x2160 Sunday-cup footage which is from a non-Veo camera
    # (phone / GoPro). Wide focal_bounds let LM refine the rough
    # initial fx; camera_position is a soft prior, not locked.
    camera_profile: "generic_4k"
    # Detection batch size: 16 fits comfortably in 30GB of L40S VRAM
    # alongside the web server's own model copy. ~1.7× faster than
    # the project default of 8. Push to 32 only when the GPU is
    # exclusive to this run.
    detection_batch_size: 16
    ransac_reproj_error: 50.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 25.0
    use_line_model: false
    focal_bounds: [4000.0, 12000.0]  # 4K focal range. Camera zooms during
                                     # the clip — frame 681 converges to
                                     # fx≈6000, frame 301 to fx≈9000. The
                                     # upper bound must cover the most-zoomed
                                     # frame; otherwise PnP RANSAC can't find
                                     # a focal that fits.
    world_residual_weight: 0.0
    joint_optimize: false
    world_error_threshold: 8.0

    # Approximate camera prior. Inferred from KP image-y order: keypoints
    # at world y=+34 land on TOP of the image (small image y) and KPs
    # at world y=+9 land lower — meaning the camera is on the -y side
    # looking towards +y. half_w = 34, so y=-34 is the near sideline;
    # the user measured the camera at ~5m beyond it, so y=-39. Clip is
    # zoomed in on the right half so x prior is positive (~7m).
    # Camera position is HARD-LOCKED — Sunday cup is a fixed sideline
    # rig, the camera doesn't move during the clip. With lock=true the
    # LM removes tvec from optimization (recomputes it as -R·C every
    # step) and only solves rvec + fx. This eliminates the failure
    # mode where LM drifts the camera centre to a wrong basin trying
    # to compensate for a sparse / noisy keypoint set.
    camera_position: [7.0, -39.0, 5.0]
    lock_camera_position: true
    position_weight: 25.0  # unused when lock=true

    # Camera tilt below horizon (degrees). Sunday-cup rig sits low
    # (~5m tall, ~35m behind goal line), so the camera looks nearly
    # horizontally — typical pitch_deg is 3–10°, never near broadcast
    # truck levels (20–30°). Bound the LM to a generous [2, 15] band:
    # this catches the runaway-into-near-flat (≤2°) and inverted
    # (>15° looks-down) failure modes without rejecting legitimate
    # frames. Barrier: 100 px / degree of violation, fixed-length.
    pitch_bounds_deg: [2.0, 15.0]

    pitch_length: 105.0
    pitch_width: 68.0

    calibration_skip: 1
    vis_interval: 1

    # SIFT chain gap-fill — re-enabled now that FeatureMatcher
    # downscales 4K input to 1080p before SIFT (max_long_side=1920),
    # roughly a 4× speedup with the same descriptors. Keypoint coords
    # are rescaled back to native 4K resolution before homography
    # matching, so downstream PnP sees full-res points.
    gap_fill_chain:
      enabled: true
      # Use the GPU LightGlue+SuperPoint matcher (~20× faster than
      # the CPU SIFT+FLANN backend on 4K, with comparable inlier
      # quality). Falls back to SIFT if lightglue isn't installed.
      matcher_backend: lightglue
      anchor_max_reproj_px: 30.0
      overwrite_above_reproj_px: 30.0
      method: improved
      smoothing_window: 5
      use_masking: false
      max_gap_frames: 60
      max_anchor_distance_frames: 120
      sift_top_skip_frac: 0.25

  # KP + Line both fine-tuned on 2 sunday_cup annotations
  # (workspace/models/keypoint_20260612_143742 + line_20260612_151703).
  pnlcalib:
    keypoint_model_path: "workspace/models/keypoint_20260614_111633/run_20260614_111637/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
    use_lines: false
    line_model_path: "workspace/models/line_20260612_151703/run_20260612_151707/models/best_model.pt"
    line_weights: "SV_lines"
    line_threshold: 0.10

device: "cuda"

# 4K source — letterbox to 1920 long edge (vs default 1280) so far-end
# players keep enough pixels for YOLO to detect them. Cuts the
# YOLO-miss rate that drove the orig 64 / orig 73 frame-897 swap
# (right-side player not detected at imgsz=1280 → tracker had only
# one detection in the area → wrong assignment cascaded).
detection:
  imgsz: 1920

# PRTReID is fine-tuned on SoccerNet (player-level), 256-dim with HRNet32.
# Same choice as the kids config — better same-team discrimination than OSNet.
reid:
  backend: "prtreid"

# 30fps tracking — scale per-sample motion budgets by 10/effective_fps.
# At 30fps a sprinting 8 m/s player covers 0.27 m/sample; the looser
# 10fps defaults (4 m gate, 1.5 m reid pitch) silently admitted multi-
# metre teleports through the pitch sanity check.
tracking:
  pitch_gate_m: 1.33                # was 4.0 @10fps → 1.33 @30fps
  reid_pitch_max_m: 0.5             # was 1.5 @10fps → 0.5 @30fps

track_consolidation:
  # 30 frames at process_fps=30 ≈ 1 second of observations — filters
  # genuine 1-2-frame YOLO false positives but keeps fragmented player
  # tids.
  min_track_frames: 30

  # Phase-2 jersey OCR runs through the LLM (Bedrock Claude Opus).
  jersey:
    ocr_backend: llm
  # stride=10 keeps OCR cost bounded at ~60 LLM calls per long track.
  frame_stride: 10

pipeline:
  stages:
    - field_registration
    - tracking
    - event_detection
    - track_consolidation
    - player_profile
    - highlights
