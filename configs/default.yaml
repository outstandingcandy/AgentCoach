# SoccerMaster Data Curation Pipeline - Default Configuration

# Stage 0: Shot Detection & Segmentation (Preprocessing)
shot_detection:
  enabled: true
  method: "adaptive"           # "adaptive", "histogram", or "fixed"
  frame_diff:
    adaptive_ratio: 3.0        # Adaptive threshold = mean + ratio * std
    window_size: 50            # Sliding window size for local statistics
  histogram:
    color_space: "hsv"         # Color space for histogram comparison
    bins: [8, 12, 3]           # Histogram bins for H, S, V channels
  min_shot_duration: 1.0       # Minimum shot duration in seconds

video_segmentation:
  enabled: true                # Whether to export segment video files
  output_format: "mkv"         # Output video format
  export_frame_ranges: true    # Export frame_ranges.json for lazy processing
  accurate_cut: true           # Re-encode for frame-accurate cuts (slower but precise)

# Video Processing
video:
  process_fps: 10         # Frames per second to process (e.g., 10 = process 10 frames per second)
                          # Set to null or 0 to process all frames
                          # Example: video at 50fps with process_fps=10 will process every 5th frame
  resize_width: 1920      # Resize width (null for original)
  resize_height: 1080     # Resize height (null for original)

# Stage 1: Field Registration
field_registration:
  backend: "pnlcalib"     # "pnlcalib" (default), "broadtrack", "physical", or "nbjw"

  # PnLCalib backend settings (used when backend="pnlcalib")
  pnlcalib:
    keypoint_weights: "SV_kp"    # "SV_kp", "WC14_kp", or "TSWC_kp"
    keypoint_threshold: 0.3434
    line_weights: "SV_lines"     # "SV_lines", "WC14_lines", or "TSWC_lines"
    line_threshold: 0.15
    pnl_refine: false            # Enable joint point+line optimization
    line_weight: 1.0             # Relative weight of line constraints vs points

  # NBJW backend settings (used when backend="nbjw")
  nbjw:
    use_prev_homography: true    # Use previous frame's H on failure
    weights_dir: null            # Path to weights (null = auto-download)

  # Physical calibrator settings (used when backend="physical")
  # Uses fixed camera intrinsics from a profile, optimizes only 6-DOF extrinsics
  physical:
    camera_profile: "veo_1080p"        # Profile name from camera_profiles.yaml
    camera_profiles_path: null          # Path to camera_profiles.yaml (null = auto)
    detection_batch_size: 8
    ransac_reproj_error: 15.0           # PnP RANSAC reprojection threshold (px)
    line_weight: 1.0                    # Weight for line residuals vs point residuals
    line_sample_points: 20              # Points sampled along each line
    max_reproj_error: 15.0              # Temporal tracker error threshold
    use_line_model: false               # Use HRNet line model (vs derive from keypoints)
    focal_bounds: [1200.0, 2200.0]    # Focal length optimization bounds (px)
    cx_bounds: [-100.0, 100.0]       # Optical center cx offset bounds (px)
    cy_bounds: [-50.0, 50.0]         # Optical center cy offset bounds (px)
    k1_bounds: [-0.35, -0.15]        # Radial distortion k1 absolute bounds
    k2_bounds: [-0.05, 0.10]         # Radial distortion k2 absolute bounds
    k3_bounds: [-0.05, 0.05]         # Radial distortion k3 absolute bounds
    world_residual_weight: 0.0       # Weight for world-space back-projection residuals (0=disabled)
    world_error_threshold: 5.0       # World-error outlier rejection threshold (meters). Use .inf to disable.
    calibration_skip: 1              # Calibrate every Nth frame (1=all, 2=half, etc). Skipped frames are interpolated.

  # Legacy settings for backwards compatibility
  keypoint_detector:
    backend: "resnet50"   # "resnet50" (default) or "pnlcalib"
    model: "resnet50"     # Backbone for resnet50 backend
    confidence_threshold: 0.5
    num_keypoints: 115    # SoccerNet-GSR format (115 for resnet50, 58 for pnlcalib)
    pnlcalib:
      weights: "SV_kp"
      confidence_threshold: 0.3434

  line_detector:
    backend: "hough"      # "hough" (default) or "pnlcalib"
    hough_threshold: 50
    min_line_length: 100
    max_line_gap: 10
    pnlcalib:
      weights: "SV_lines"
      confidence_threshold: 0.15

  pnl_solver:
    ransac_iterations: 1000
    reprojection_threshold: 8.0
    pnl_refine: false
    line_weight: 1.0

# Unified detection: single YOLO pass for both players and ball
unified_detection:
  enabled: true                         # Set false to use legacy separate detectors
  model: "yolov8x"
  # model_path: null
  confidence_threshold: 0.3            # Use ball's lower threshold; player filtering is post-hoc
  iou_threshold: 0.45
  imgsz: 1920                          # Full resolution for ball detection
  batch_size: 8                        # Conservative for 1920px (adjust based on GPU VRAM)
  player_confidence_threshold: 0.5     # Post-hoc filter applied to player detections

# Stage 2: Tracking and Identification
detection:
  model: "yolov8x"        # YOLO model name (yolov8x, yolo11x, etc.)
  # model_path: null       # Optional: explicit path to .pt weights file
  confidence_threshold: 0.5
  iou_threshold: 0.45
  classes: [0]            # Person class only
  imgsz: 1280

# Ball Detection (sports ball class 32 in COCO)
ball_detection:
  enabled: true
  model: "yolov8x"           # YOLO model name (yolov8x, yolo11x, etc.)
  # model_path: null          # Optional: explicit path to .pt weights file
  confidence_threshold: 0.3  # Lower threshold for small object
  iou_threshold: 0.45
  classes: [32]              # Sports ball class
  imgsz: 1920                # Higher resolution for small ball
  min_size: 3                # Minimum bbox dimension in pixels
  max_size: 100              # Maximum bbox dimension in pixels
  min_aspect_ratio: 0.5      # Ball should be roughly circular
  max_aspect_ratio: 2.0
  # SAHI sliced inference for improved small ball detection
  use_sahi: false # SAHI is slower and produces more false positives; disable by default
  sahi_slice_size: 640                    # Slice dimensions (pixels)
  sahi_overlap_ratio: 0.2                 # Overlap between adjacent slices
  sahi_perform_standard_pred: true        # Also run full-frame inference (catches large balls)
  sahi_postprocess_type: "GREEDYNMM"     # "NMS", "NMM", or "GREEDYNMM"
  sahi_postprocess_match_threshold: 0.5
  # Two-pass detection: scan whole video first, then crop+enlarge missed frames
  two_pass: true                          # Enable two-pass ball detection
  pass1_confidence_threshold: 0.5         # High threshold for anchor detections in pass 1
  crop_size: 300                          # Crop region size around interpolated position (pixels)
  crop_enlarge_to: 640                    # Resize crop to this before detection
  max_interpolation_gap: 300              # Max frames to interpolate across (skip if gap is larger)
  pass1_batch_size: 8                     # Batch size for pass 1 GPU inference (full-res, needs more VRAM)
  pass2_batch_size: 32                    # Batch size for pass 2 GPU inference (640x640 crops, lighter)
  # Field-space trajectory filtering (applied after tracking)
  field_filter:
    enabled: true
    max_speed_ms: 40.0            # Max realistic ball speed (m/s)
    position_margin: 8.0           # Meters beyond pitch boundary to allow
    min_trajectory_length: 3       # Minimum observations per trajectory
    smoothness_threshold: 0.6      # Min average cosine of direction changes
    speed_violation_ratio: 0.2     # Max fraction of frames exceeding speed limit
    min_displacement: 1.0          # Min total displacement (meters) between first and last point
    merge_max_distance: 40.0       # Max pitch distance (m) to nearest existing frame when merging trajectories

# Ball Tracking (ByteTrack / BoT-SORT)
ball_tracking:
  enabled: true
  tracker_type: botsort       # "bytetrack" or "botsort"
  track_high_thresh: 0.15    # High-confidence threshold for first-stage matching
  track_low_thresh: 0.1      # Low-confidence threshold for second-stage IoU rescue
  track_buffer: 15           # Frames to keep lost tracks (1.5s at 10fps)
  match_thresh: 0.8          # Distance threshold for matching (normalized center distance)
  new_track_thresh: 0.4      # Min confidence for new track initialization (higher than track_high to avoid false positives)
  max_position_distance: 120  # Max pixel distance for center-distance matching
  fuse_score: true            # Fuse detection score into distance matrix
  # BoT-SORT specific (ignored when tracker_type=bytetrack)
  gmc_method: "none"          # Camera motion compensation: "sparseOptFlow", "orb", "none"
  with_reid: false            # Ball appearance is uniform, ReID not useful
  proximity_thresh: 0.5       # Spatial proximity threshold
  appearance_thresh: 0.25     # Appearance similarity threshold
  # 3D trajectory estimation (physics-based parabolic model)
  trajectory_3d:
    enabled: true
    window_size: 15           # Max observations in sliding window
    min_observations: 4       # Minimum frames to attempt 3D fit
    gravity: 9.81             # m/s²
    ball_real_diameter: 0.22  # FIFA size 5 ball diameter in meters (unused in 3D estimation)
    bbox_padding: 1.0        # Legacy: no longer used for depth estimation
    ground_contact_weight: 2.0  # Soft penalty weight for Z≈0 at trajectory endpoints

tracking:
  algorithm: "strongsort"
  max_age: 30             # Max frames to keep lost tracks
  min_hits: 3             # Min detections before track is confirmed
  iou_threshold: 0.3

reid:
  backend: "osnet"        # "osnet" (default) or "prtreid"
  model: "osnet_x1_0"     # Model for OSNet backend
  feature_dim: 512        # Feature dimension (512 for OSNet, 256 for PRTReID)
  batch_size: 32

  # OSNet backend settings (used when backend="osnet")
  osnet:
    model: "osnet_x1_0"
    feature_dim: 512

  # PRTReID backend settings (used when backend="prtreid")
  prtreid:
    feature_dim: 256
    referee_confidence_threshold: 0.85
    goalkeeper_confidence_threshold: 0.7
    weights_path: null    # Path to weights (null = auto-download)

jersey_recognition:
  backend: "qwen_vl"      # "qwen_vl" (default) or "mmocr"
  enabled: false          # Whether jersey recognition is enabled
  mode: "local"           # "local" or "api" (for qwen_vl backend)

  # Qwen VL backend settings (used when backend="qwen_vl")
  local:
    model: "Qwen/Qwen3-VL-8B-Instruct"
    device: "cuda"
    max_new_tokens: 10
  api:
    base_url: null        # API endpoint URL
    model: "qwen3-vl-8b"
    api_key_env: "QWEN_API_KEY"

  # MMOCR backend settings (used when backend="mmocr")
  mmocr:
    det_model: "dbnet_resnet18_fpnc_1200e_icdar2015"
    rec_model: "SAR"
    min_confidence: 0.3
    batch_size: 1

team_classification:
  backend: "kmeans"       # "kmeans" (default) or "tracklet"
  position_weight: 0.1    # Weight for position features in clustering
  min_samples_per_team: 5 # Minimum samples before classification

  # Tracklet clustering settings (used when backend="tracklet")
  tracklet:
    n_clusters: 2
    random_state: 42
    n_init: 10
    min_samples: 2

role_classification:
  # Classification mode:
  # - "reid": Use ReID embeddings for team classification (RECOMMENDED - SoccerMaster paper)
  # - "color": Legacy color histogram clustering (not recommended)
  mode: "reid"
  n_clusters: 2           # Two teams
  use_field_position: true  # Use pitch position to assign left/right labels

  # Legacy color-based settings (only used when mode="color")
  color_space: "hsv"
  feature_type: "histogram"
  use_background_removal: true

visualization:
  backend: "minimal"      # "minimal" (default) or "step"

# Stage 3: Post-processing
postprocess:
  sam2:
    enabled: true
    model: "sam2_hiera_large"
    device: "cuda"
  majority_voting:
    window_size: 5        # Temporal window for voting
  trajectory_merger:
    reid_threshold: 0.8   # Cosine similarity threshold
    max_gap_frames: 30    # Max frames gap for merging
    require_same_jersey: true

# Stage 4: Highlight Clipping (agent-based)
highlights:
  enabled: false
  output_fps: 25.0
  crossfade_frames: 4
  closeup:
    output_size: [640, 360]       # Close-up crop resolution (w, h)
    padding_factor: 2.0           # How much to expand bbox for close-up
    smooth_alpha: 0.3             # EMA alpha for crop center smoothing
    medium_padding_factor: 4.0    # Padding for "medium" view type
  temporal:
    buildup_max_seconds: 10.0     # Max lookback for build-up start
    buildup_padding_seconds: 2.0  # Extra padding before build-up start
    celebration_seconds: 4.0      # Duration of celebration segment
    goal_moment_seconds: 2.0      # Duration of goal moment close-up
  overlays:
    enabled: true
    show_event_label: true
    show_timestamp: true
  goal_detection:
    min_confidence: 0.15
  recipes:
    - name: "goal_highlight"
      detector: "goal"
      analyzer: "scorer"
      composer: "segment"

# Output
output:
  format: "json"          # Output format
  save_visualizations: true
  visualization_fps: 10
  save_embeddings: false  # Whether to save ReID embeddings

# Hardware
device: "cuda"            # "cuda" or "cpu"
num_workers: 4
batch_size: 16

# Event Detection
events:
  detectors:
    - possession
    - pass
    - shot
    - carry
    - defensive
  possession:
    distance_threshold: 3.0         # meters — max player-ball distance for possession (wider for tracking noise)
    min_consecutive_seconds: 0.5    # seconds — minimum duration to confirm possession (catch short touches)
    speed_break_threshold: 20.0     # m/s — ball speed above which possession breaks (allow fast dribbles)
  pass:
    pass_speed_threshold: 3.0       # m/s — minimum ball speed to qualify as a pass (catch short passes)
    max_transit_seconds: 3.0        # seconds — max gap between possession spans (allow longer aerial passes)
  shot:
    shot_speed_threshold: 8.0       # m/s — minimum ball speed for a shot (filter slow crosses)
    max_angle_to_goal: 30.0         # degrees — max angle deviation from goal
    min_confidence: 0.15            # minimum ball detection confidence
    shooter_lookback_seconds: 5.0   # seconds — how far back to look for shooter (wider window)
    dedup_gap_seconds: 2.0          # seconds — deduplication window
    approach_window_seconds: 1.5    # seconds — approach direction check window
    max_frame_gap_seconds: 1.0      # seconds — max gap between consecutive ball obs
    approach_margin: 3.0            # meters — detect shots when ball is within this distance of goal line
    tracking_lost_seconds: 1.0      # seconds — gap in tracking that indicates ball left the field
  carry:
    min_duration_seconds: 1.0       # seconds — minimum possession duration (catch shorter carries)
    min_total_distance: 3.0         # meters — total displacement threshold
    min_forward_distance: 2.0       # meters — forward progress threshold
  defensive:
    tackle_proximity: 3.0           # meters — defender must be this close to ball
    tackle_deflection_angle: 30.0   # degrees — ball direction change threshold (more sensitive)
    tackle_max_gap_seconds: 1.0     # seconds — max gap between possession spans for tackle
    deflection_window_seconds: 0.5  # seconds — window for computing ball deflection angle

# Pipeline orchestration
# Available stages: shot_detection, field_registration, tracking, post_processing, event_detection, goal_detection
pipeline:
  stages:
    - field_registration
    - tracking
    - post_processing
