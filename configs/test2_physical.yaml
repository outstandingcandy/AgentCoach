# Configuration for test2.mp4 — different venue/camera, needs open intrinsics
video:
  process_fps: 0.5

field_registration:
  backend: "physical"

  physical:
    camera_profile: "veo_1080p"
    ransac_reproj_error: 30.0
    line_weight: 1.0
    line_sample_points: 20
    max_reproj_error: 15.0
    use_line_model: false
    focal_bounds: [1200.0, 2200.0]
    world_residual_weight: 10.0
    joint_optimize: true

  pnlcalib:
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.15
