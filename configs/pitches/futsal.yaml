# FIFA Futsal 5-a-side pitch (40 × 20 m).
#
# Penalty area is the real D shape: two r=6 m quarter-arcs centered on
# the goal posts joined by a 3 m straight chord at the front of the
# area. Encoded via penalty_area_shape: d, with:
#   * penalty_area_length = 6 m  (arc radius)
#   * penalty_area_width  = 3 m  (chord length = goal width)
# The renderer in pitch_diagram.draw_pitch_structure branches on shape
# and skips the single penalty-mark-centered arc used for 11-a-side.
label: "Futsal 5-a-side (40×20 m)"
description: "FIFA Futsal Laws — D-shape penalty area with post-centered arcs."

pitch:
  pitch_length: 40.0
  pitch_width: 20.0
  penalty_area_shape: d
  penalty_area_width: 3.0
  penalty_area_length: 6.0
  goal_area_width: 3.0
  goal_area_length: 3.0
  goal_line_to_penalty_mark: 6.0
  center_circle_radius: 3.0
  goal_height: 2.0
  goal_length: 3.0
