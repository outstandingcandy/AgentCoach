# FIFA 11-a-side standard pitch (105 × 68 m).
#
# Used by the field-registration backends + downstream events / highlights
# whenever ``pitch_type: fifa`` is set in a config. All measurements in
# metres; flip y so that the top of a render is +pitch_width/2 (matches
# the y-up convention used by SoccerPitch and PnLCalib).
label: "FIFA 11-a-side (105×68 m)"
description: "Full-size FIFA standard pitch."

pitch:
  pitch_length: 105.0
  pitch_width: 68.0
  penalty_area_width: 40.32
  penalty_area_length: 16.5
  goal_area_width: 18.32
  goal_area_length: 5.5
  goal_line_to_penalty_mark: 11.0
  center_circle_radius: 9.15
  goal_height: 2.44
  goal_length: 7.32
