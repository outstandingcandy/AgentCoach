# clip_000_finetuned.yaml
# Comments / rationale live in docs/config_notes.md (#clip_000_finetuned.yaml).

video:
  process_fps: 10
field_registration:
  backend: "pnlcalib"
  pnlcalib:
    keypoint_model_path: "data/finetuned_models/run_20260319_135637/models/best_model.pt"
    keypoint_weights: "SV_kp"
    keypoint_threshold: 0.25
    line_weights: "SV_lines"
    line_threshold: 0.5
    calibration_method: "iterative_pnp"
    pnl_refine: true
    line_weight: 1.0
detection:
  model: "yolov8x"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 1280
ball_detection:
  enabled: true
  confidence_threshold: 0.3
tracking:
  algorithm: "strongsort"
  max_age: 50
reid:
  backend: "osnet"
  model: "osnet_x1_0"
team_classification:
  backend: "kmeans"
  position_weight: 0.1
device: "cuda"
